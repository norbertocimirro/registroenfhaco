        const ChartComponent = ({ type, data, options, height = "100%" }) => {
            const chartRef = useRef(null); const chartInstance = useRef(null);
            React.useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                Chart.defaults.color = window.matchMedia('print').matches ? '#334155' : '#94a3b8';
                chartInstance.current = new Chart(chartRef.current.getContext('2d'), { type, data, options });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data, options, type]);
            return <div style={{ position: 'relative', height, width: '100%' }}><canvas ref={chartRef}></canvas></div>;
        };

        const wrapText = (text, maxLength = 14) => {
            const words = text.split(' '); let lines = []; let currentLine = '';
            words.forEach(w => {
                if ((currentLine + w).length > maxLength) { if (currentLine.trim()) lines.push(currentLine.trim()); currentLine = w + ' '; } 
                else currentLine += w + ' ';
            });
            if(currentLine.trim()) lines.push(currentLine.trim()); return lines;
        };

        // =====================================================================

        const PERIODOS = [

            { id: '2026-11', label: '15/11/2026 a 14/12/2026', short: 'Nov/Dez' },

            { id: 24, sec: "Avaliação de Enfermagem", text: "Possui Evolução de Enfermagem diária?" },

            { id: 26, sec: "Avaliação de Enfermagem", text: "Em caso de transferência, há Evolução do setor de origem e de destino?" },
            { id: 27, sec: "Avaliação de Enfermagem", text: "Em caso de óbito, há evolução de enfermagem relativa ao ocorrido?" },
            { id: 28, sec: "Avaliação de Enfermagem", text: "A Evolução de Enfermagem encontra-se devidamente carimbada e assinada?" },
            { id: 29, sec: "Avaliação de Enfermagem", text: "São registradas anotações de Enfermagem?" },
            { id: 30, sec: "Avaliação de Enfermagem", text: "As Anotações de Enfermagem encontram-se devidamente carimbadas e assinadas?" },
            { id: 31, sec: "Avaliação de Enfermagem", text: "São registradas anotações no formulário da SRPA?" },
            { id: 32, sec: "Avaliação de Enfermagem", text: "As Anotações da SRPA encontram-se devidamente carimbadas e assinadas?" }
        ];

        const calculateStats = (records) => {
            const qStats = PERGUNTAS_AUDITORIA.map(q => {
                let sim = 0, nao = 0, na = 0;
                records.forEach(r => {
                    if(r.answers[q.id] === 'SIM') sim++; else if(r.answers[q.id] === 'NÃO') nao++; else if(r.answers[q.id] === 'NA') na++;
                });
                const totalValido = sim + nao;
                return { ...q, sim, nao, na, pct: totalValido > 0 ? Math.round((sim / totalValido) * 100) : 0, pctFalta: totalValido > 0 ? Math.round((nao / totalValido) * 100) : 0, totalValido };
            });
            let tSim = 0, tNao = 0; qStats.forEach(s => { tSim += s.sim; tNao += s.nao; });
            return { qStats, globalPct: (tSim + tNao) > 0 ? Math.round((tSim / (tSim + tNao)) * 100) : 0, totalSimGeral: tSim, totalNaoGeral: tNao, sections: [...new Set(PERGUNTAS_AUDITORIA.map(q => q.sec))] };
        };

        // =====================================================================
        // MÓDULO NOVO (V34): CALCULADORA RÁPIDA DE ESCALAS (TOTALMENTE ISOLADA)
        // =====================================================================
        const titlesBraden = { p: "Percepção Sensorial", u: "Umidade", a: "Atividade", m: "Mobilidade", n: "Nutrição", f: "Fricção / Cisalhamento" };
        const titlesFugulin = { em: "Estado Mental", ox: "Oxigenação", sv: "Sinais Vitais", mo: "Motilidade", lo: "Locomoção", al: "Alimentação", cc: "Cuidado Corporal", el: "Eliminações", te: "Terapêutica" };

        const bradenFull = { p: ["1. Total limitado", "2. Muito limitado", "3. Levemente limitado", "4. Sem limitação"], u: ["1. Constantemente úmida", "2. Muito úmida", "3. Ocasionalmente úmida", "4. Raramente úmida"], a: ["1. Acamado", "2. Em cadeira", "3. Deambula ocasionalmente", "4. Deambula frequentemente"], m: ["1. Total imóvel", "2. Muito limitada", "3. Levemente limitada", "4. Sem limitações"], n: ["1. Muito pobre", "2. Inadequada", "3. Adequada", "4. Excelente"], f: ["1. Problema", "2. Problema potencial", "3. Nenhum problema"] };
        const fugulinFull = { em: ["Lúcido(1)", "Desorientado(2)", "Confuso(3)", "Comatoso(4)"], ox: ["Ar ambiente(1)", "O2 Interm.(2)", "O2 Contínuo(3)", "Vent.Mec(4)"], sv: ["Rotina(1)", "Intervalo 4h(2)", "Intervalo 2h(3)", "Monitor<1h(4)"], mo: ["Ativo(1)", "Limitação(2)", "Grande limitação(3)", "Imóvel(4)"], lo: ["Deambula(1)", "Cadeira(2)", "Sentar aux.(3)", "Restrito leito(4)"], al: ["Indep.(1)", "Auxílio(2)", "SNE/GTT(3)", "NPT(4)"], cc: ["Independente(1)", "Aux.banho(2)", "Higiene leito(3)", "Higiene complexa(4)"], el: ["Independente(1)", "Auxílio(2)", "Incontinência(3)", "Diálise(4)"], te: ["Oral(1)", "EV<24h(2)", "EV>24h(3)", "Vasoativos(4)"] };
        const morseFull = { h: ["Não(0)", "Sim(25)"], d: ["Não(0)", "Sim(15)"], a: ["Nenhum(0)", "Auxílio(15)", "Móveis(30)"], t: ["Não(0)", "Sim(20)"], m: ["Normal(0)", "Fraca(10)", "Comprometida(20)"], e: ["Orientado(0)", "Esquece limites(15)"] };

        const CalcScaleRadio = ({ label, options, values, value, onChange, color='blue' }) => {
            const colorStyles = {
                blue: 'bg-blue-600 border-blue-500 text-white',
                emerald: 'bg-emerald-600 border-emerald-500 text-white',
                purple: 'bg-purple-600 border-purple-500 text-white'
            };
            const titleColors = {
                blue: 'text-blue-400',
                emerald: 'text-emerald-400',
                purple: 'text-purple-400'
            };
            return (
                <div className="space-y-2 mb-4">
                    <div className={`text-[11px] font-black uppercase tracking-widest ${titleColors[color]}`}>{label}</div>
                    <div className="flex flex-col gap-2">
                        {options.map((opt, idx) => {
                            const val = values ? values[idx] : idx + 1;
                            const active = value === val;
                            return (
                                <button key={idx} onClick={() => onChange(val)} className={`text-left px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all border ${active ? colorStyles[color] : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-slate-500 hover:bg-slate-700/50'}`}>
                                    {opt}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const CalculadorasApp = () => {
            const initialState = {
                braden: { p:null, u:null, a:null, m:null, n:null, f:null },
                morse: { h:null, d:null, a:null, t:null, m:null, e:null },
                fugulin: { em:null, ox:null, sv:null, mo:null, lo:null, al:null, cc:null, el:null, te:null }
            };
            const [escalas, setEscalas] = useState(initialState);

            const bradenCalc = useMemo(() => { 
                const b=escalas.braden; 
                if(b.p===null && b.u===null && b.a===null && b.m===null && b.n===null && b.f===null) return {t: 0, r: "Pendente"};
                const t=(b.p||0)+(b.u||0)+(b.a||0)+(b.m||0)+(b.n||0)+(b.f||0); 
                return {t, r: t>=19?"Sem Risco":t>=15?"Baixo":t>=13?"Moderado":t>=10?"Alto":"Muito Elevado"}; 
            }, [escalas.braden]);

            const morseCalc = useMemo(() => { 
                const m=escalas.morse; 
                if(m.h===null && m.d===null && m.a===null && m.t===null && m.m===null && m.e===null) return {t: 0, r: "Pendente"};
                const t=(m.h||0)+(m.d||0)+(m.a||0)+(m.t||0)+(m.m||0)+(m.e||0); 
                return {t, r: t>=45?"Elevado":t>=25?"Moderado":"Baixo"}; 
            }, [escalas.morse]);

            const fugulinCalc = useMemo(() => { 
                const f = escalas.fugulin;
                const vals = Object.values(f);
                if(vals.every(x => x === null)) return {t: 0, d: "Pendente"};
                const t = vals.reduce((a,b)=>(a||0)+(b||0),0); 
                return {t, d: t>31?"Intensivos":t>26?"Semi-Int.":t>20?"Alta Dep.":t>14?"Intermed.":"Mínimos"}; 
            }, [escalas.fugulin]);

            const reset = () => {
                if(window.confirm("Limpar todos os dados das escalas?")) {
                    setEscalas(initialState);
                }
            };

            return (
                <div className="max-w-5xl mx-auto w-full animate-fade flex flex-col pb-12 px-4 sm:px-6">

                        </div>

                        </button>
                    </header>
                    
                    <div className="space-y-8">
                        {/* Braden */}
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-sm">

                                <div className="text-6xl font-black text-white mb-2">{bradenCalc.t} <span className="text-xl text-slate-500 font-bold">Pts</span></div>
                                <div className={`px-6 py-2 rounded-full text-sm font-black uppercase tracking-widest ${bradenCalc.t > 0 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-500'}`}>
                                    {bradenCalc.r}
                                </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {Object.entries(bradenFull).map(([k,opts])=><CalcScaleRadio key={k} color="blue" label={titlesBraden[k]} options={opts} value={escalas.braden[k]} onChange={v=>setEscalas({...escalas,braden:{...escalas.braden,[k]:v}})}/>)}
                            </div>
                        </div>

                        {/* Fugulin */}
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-sm">
                            <div className="flex flex-col items-center justify-center bg-slate-950 p-6 rounded-2xl mb-8 border border-slate-800 shadow-inner text-center">

        // =====================================================================

        const nandaIntegral = [

            { d: 8, name: "Sexualidade", diagnoses: ["Padrão de sexualidade ineficaz", "Disfunção sexual", "Processo de maternidade ineficaz", "Risco de processo de maternidade ineficaz", "Risco de díade materno-fetal perturbada"] },
            { d: 9, name: "Enfrentamento/Stress", diagnoses: ["Ansiedade", "Medo", "Tristeza crônica", "Luto desadaptativo", "Risco de luto desadaptativo", "Enfrentamento ineficaz", "Enfrentamento familiar comprometido", "Impotência", "Risco de impotência", "Resiliência prejudicada", "Síndrome do trauma de estupro", "Síndrome do estresse de mudança", "Planejamento de atividades ineficaz", "Disreflexia autonômica", "Comportamento infantil desorganizado"] },
            { d: 10, name: "Princípios de Vida", diagnoses: ["Sofrimento espiritual", "Risco de sofrimento espiritual", "Conflito de decisões", "Não adesão", "Angústia moral", "Religiosidade prejudicada"] },
            { d: 11, name: "Segurança/Proteção", diagnoses: ["Risco de infecção", "Integridade da pele prejudicada", "Risco de integridade da pele prejudicada", "Integridade tissular prejudicada", "Risco de lesão por pressão em adulto", "Risco de lesão por pressão infantil", "Risco de lesão por pressão neonatal", "Risco de queda", "Risco de aspiração", "Risco de choque", "Risco de trauma vascular", "Risco de lesão do trato urinário", "Risco de lesão de posicionamento perioperatório", "Termorregulação ineficaz", "Hipertermia", "Hipotermia", "Risco de hipotermia", "Risco de reação alérgica", "Risco de comportamento suicida", "Automutilação"] },
            { d: 12, name: "Conforto", diagnoses: ["Dor aguda", "Dor crônica", "Síndrome de dor crônica", "Dor do parto", "Conforto prejudicado", "Náusea", "Isolamento social"] },
            { d: 13, name: "Cresc. e Desenvolv.", diagnoses: ["Atraso no desenvolvimento infantil", "Risco de atraso no desenvolvimento infantil", "Atraso no desenvolvimento motor infantil", "Risco de atraso no desenvolvimento motor infantil"] }
        ];

        const InputField = ({ label, value, onChange, placeholder='' }) => (
            <div className="w-full mb-3">
                <div className="text-[10px] font-bold uppercase text-slate-400 mb-1">{label}</div>
                <input className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 outline-none" value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}/>
            </div>
        );
        const TextAreaField = ({ label, value, onChange, h="h-32" }) => (
            <div className="w-full mb-3">
                <div className="text-[10px] font-bold uppercase text-slate-400 mb-1">{label}</div>
                <textarea className={`w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 outline-none ${h}`} value={value} onChange={e => onChange(e.target.value)} />
            </div>
        );

        const SoicApp = () => {
            const [activeTab, setActiveTab] = useState('EVOLUCAO');
            const [activeSection, setActiveSection] = useState('S');
            const [openScale, setOpenScale] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [copySuccess, setCopySuccess] = useState(false);
            
            const initialSoicState = {
                adm: { procedencia: '', acompanhante: '', queixa: '', hpp: '' },
                subjetivo: '', sv: { pa: '', fc: '', fr: '', temp: '', spo2: '', hgt: '', eva: '' },
                exame: {}, vasculares: [], viasAereas: [], eliminações: [], diagnosticos: [],
                interpretacao: '', condutas: [], obs: '',
                escalas: { 
                    braden: { p:null, u:null, a:null, m:null, n:null, f:null }, 
                    morse: { h:null, d:null, a:null, t:null, m:null, e:null }, 
                    fugulin: { em:null, ox:null, sv:null, mo:null, lo:null, al:null, cc:null, el:null, te:null } 
                },
                alta: { condicoes: '', destino: '', orientacoes: '' }
            };
            const [form, setForm] = useState(initialSoicState);

            const bradenCalc = useMemo(() => { 
                const b=form.escalas.braden; 
                if(b.p===null && b.u===null && b.a===null && b.m===null && b.n===null && b.f===null) return {t: 0, r: "Pendente"};
                const t=(b.p||0)+(b.u||0)+(b.a||0)+(b.m||0)+(b.n||0)+(b.f||0); 
                return {t, r: t>=19?"Sem Risco":t>=15?"Baixo":t>=13?"Moderado":t>=10?"Alto":"Muito Elevado"}; 
            }, [form.escalas.braden]);

            const morseCalc = useMemo(() => { 
                const m=form.escalas.morse; 
                if(m.h===null && m.d===null && m.a===null && m.t===null && m.m===null && m.e===null) return {t: 0, r: "Pendente"};
                const t=(m.h||0)+(m.d||0)+(m.a||0)+(m.t||0)+(m.m||0)+(m.e||0); 
                return {t, r: t>=45?"Elevado":t>=25?"Moderado":"Baixo"}; 
            }, [form.escalas.morse]);

            const fugulinCalc = useMemo(() => { 
                const f = form.escalas.fugulin;
                const vals = Object.values(f);
                if(vals.every(x => x === null)) return {t: 0, d: "Pendente"};
                const t = vals.reduce((a,b)=>(a||0)+(b||0),0); 
                return {t, d: t>31?"Intensivos":t>26?"Semi-Int.":t>20?"Alta Dep.":t>14?"Intermed.":"Mínimos"}; 
            }, [form.escalas.fugulin]);

            const generateText = () => {
                if (activeTab === 'ADMISSAO') return `ADMISSÃO ENFERMAGEM - HACO\n----------------------------------\n[HISTÓRICO]\nProcedência: ${form.adm.procedencia||'--'}\nAcompanhante: ${form.adm.acompanhante||'--'}\nQueixa Principal: ${form.adm.queixa||'--'}\nHPP e Alergias: ${form.adm.hpp||'--'}\n\n[SINAIS VITAIS ENTRADA]\nPA: ${form.sv.pa||'-'} | FC: ${form.sv.fc||'-'} | FR: ${form.sv.fr||'-'}\nT: ${form.sv.temp||'-'} | Sat: ${form.sv.spo2||'-'}% | HGT: ${form.sv.hgt||'-'}\nDor (EVA): ${form.sv.eva||'-'}\n----------------------------------\n[Resolução 736/2024 - GT SAE HACO]`;
                if (activeTab === 'ALTA') return `ALTA DE ENFERMAGEM - HACO\n----------------------------------\n- Condições de Alta: ${form.alta.condicoes||'--'}\n- Destino da Alta: ${form.alta.destino||'--'}\n- Orientações Fornecidas: ${form.alta.orientacoes||'--'}\n----------------------------------\nPaciente ciente.`;
                
                let text = `S: ${form.subjetivo || 'Paciente estável, sem queixas intercorrentes.'}\n\n`;
                text += `O: [SINAIS VITAIS]\nPA: ${form.sv.pa||'-'} | FC: ${form.sv.fc||'-'} | FR: ${form.sv.fr||'-'} | T: ${form.sv.temp||'-'} | Sat: ${form.sv.spo2||'-'}% | EVA: ${form.sv.eva||'-'}\n\n`;
                text += `[ESCALAS TÉCNICAS]\n- Braden: ${bradenCalc.t > 0 ? bradenCalc.t : '-'} (${bradenCalc.r})\n- Morse: ${morseCalc.t > 0 ? morseCalc.t : '-'} (${morseCalc.r})\n- Fugulin: ${fugulinCalc.t > 0 ? fugulinCalc.t : '-'} (${fugulinCalc.d})\n\n`;
                
                let temExame = false;
                Object.entries(form.exame).forEach(([cat, vals]) => { if(vals.length>0) { text += `- ${cat}: ${vals.join(', ')}\n`; temExame = true; }});
                if(temExame) text += '\n';

                if (form.vasculares.length > 0 || form.viasAereas.length > 0 || form.eliminações.length > 0) {
                    text += `[INVASIVOS E ELIMINAÇÕES]\n`;
                    form.vasculares.forEach(v => text += `- Acesso: ${v.tipo} em ${v.sitio} (${v.obs})\n`);
                    form.viasAereas.forEach(va => text += `- Via Aérea: ${va.tipo} (Fixação: ${va.fixacao}cm)\n`);
                    form.eliminações.forEach(e => text += `- Sonda/Dreno: ${e.tipo} | Asp: ${e.aspecto} | Débito: ${e.debito}ml\n`);
                    text += '\n';
                }

                text += `I: [NANDA-I]\n`;
                if(form.diagnosticos.length>0) form.diagnosticos.forEach(d => text += `- ${d}\n`); else text += `- Sem novos diagnósticos prioritários.\n`;
                text += `Raciocínio Clínico: ${form.interpretacao || 'Manutenção do quadro atual.'}\n\n`;
                
                text += `C: [PLANO DE CUIDADOS E CONDUTAS]\n`;
                if(form.condutas.length>0) form.condutas.forEach(c => text += `- ${c}\n`); else text += `- Manter cuidados de rotina.\n`;
                text += `- Notas: ${form.obs || 'Sem observações adicionais.'}\n\n`;
                return text + `[Resolução COFEN 736/2024 - GT SAE HACO]`;
            };

            const copyAghuse = () => { navigator.clipboard.writeText(generateText()); setCopySuccess(true); setTimeout(()=>setCopySuccess(false), 2000); };
            const toggleExame = (cat, val) => { const c = form.exame[cat]||[]; setForm({...form, exame: {...form.exame, [cat]: c.includes(val)?c.filter(x=>x!==val):[...c, val]}}); };

            return (
                <div className="flex flex-col lg:flex-row h-full gap-6 animate-fade">
                    <div className="flex-1 bg-slate-900 border border-slate-800 rounded-xl flex flex-col overflow-hidden">

                            <div className="flex gap-2">
                                <button onClick={()=>setActiveTab('ADMISSAO')} className={`px-4 py-2 rounded-lg text-[10px] font-bold uppercase transition-colors ${activeTab==='ADMISSAO'?'bg-blue-600 text-white':'text-slate-400 hover:bg-slate-700'}`}>Admissão</button>
                                <button onClick={()=>setActiveTab('EVOLUCAO')} className={`px-4 py-2 rounded-lg text-[10px] font-bold uppercase transition-colors ${activeTab==='EVOLUCAO'?'bg-emerald-600 text-white':'text-slate-400 hover:bg-slate-700'}`}>Evolução (SOIC)</button>
                                <button onClick={()=>setActiveTab('ALTA')} className={`px-4 py-2 rounded-lg text-[10px] font-bold uppercase transition-colors ${activeTab==='ALTA'?'bg-red-600 text-white':'text-slate-400 hover:bg-slate-700'}`}>Alta</button>
                            </div>
                            <button onClick={()=> {if(window.confirm("Limpar dados do prontuário atual?")) setForm(initialSoicState);}} className="px-4 py-2 rounded-lg text-[10px] font-bold uppercase transition-colors bg-slate-700 text-slate-300 hover:bg-red-600 hover:text-white flex items-center gap-2">
                                <Icons.Trash size={14}/> Limpar
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar">
                            
                            {activeTab === 'ADMISSAO' && (
                                <div className="space-y-6">
                                    <div className="space-y-4">
                                        <InputField label="Procedência" value={form.adm.procedencia} onChange={v=>setForm({...form, adm:{...form.adm, procedencia:v}})}/>
                                        <InputField label="Acompanhante" value={form.adm.acompanhante} onChange={v=>setForm({...form, adm:{...form.adm, acompanhante:v}})}/>
                                        <TextAreaField label="Queixa Principal / Motivo da Internação" value={form.adm.queixa} onChange={v=>setForm({...form, adm:{...form.adm, queixa:v}})} h="h-24"/>
                                        <TextAreaField label="História Pregressa (HPP) e Alergias" value={form.adm.hpp} onChange={v=>setForm({...form, adm:{...form.adm, hpp:v}})} h="h-32"/>
                                    </div>
                                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                        <div className="text-[10px] font-bold uppercase text-slate-400 mb-3">Sinais Vitais de Entrada</div>

                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'ALTA' && (
                                <div className="space-y-6">
                                    <TextAreaField label="Condições de Alta" value={form.alta.condicoes} onChange={v=>setForm({...form, alta:{...form.alta, condicoes:v}})} h="h-32"/>
                                    <InputField label="Destino da Alta (Casa, Transferência, Óbito)" placeholder="Ex: Casa, CTI, Óbito..." value={form.alta.destino} onChange={v=>setForm({...form, alta:{...form.alta, destino:v}})}/>
                                    <TextAreaField label="Orientações Fornecidas e Prescrições" value={form.alta.orientacoes} onChange={v=>setForm({...form, alta:{...form.alta, orientacoes:v}})} h="h-48"/>
                                </div>
                            )}

                            {activeTab === 'EVOLUCAO' && (
                                <div className="space-y-6">
                                    <div className="flex gap-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700">

                                    </div>

                                        <div className="space-y-6">
                                            <div className="grid grid-cols-4 lg:grid-cols-7 gap-2">
                                                {['pa','fc','fr','temp','spo2','hgt','eva'].map(v=><div key={v} className="bg-slate-800 p-3 rounded-xl border border-slate-700"><div className="text-[9px] font-bold uppercase text-slate-500 mb-1">{v==='eva'?'Dor':v}</div><input className="w-full bg-transparent text-sm font-bold text-white outline-none" value={form.sv[v]} onChange={e=>setForm({...form,sv:{...form.sv,[v]:e.target.value}})} placeholder="-"/></div>)}

                                            {openScale === 'fugulin' && <div className="grid grid-cols-2 md:grid-cols-3 gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700">{Object.entries(fugulinFull).map(([k,opts])=><CalcScaleRadio key={k} color="emerald" label={titlesFugulin[k]} options={opts} value={form.escalas.fugulin[k]} onChange={v=>setForm({...form,escalas:{...form.escalas,fugulin:{...form.escalas.fugulin,[k]:v}}})}/>)}</div>}
                                            {openScale === 'morse' && <div className="grid grid-cols-2 md:grid-cols-3 gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700"><CalcScaleRadio color="purple" label="Histórico de Quedas" options={morseFull.h} values={[0,25]} value={form.escalas.morse.h} onChange={v=>setForm({...form,escalas:{...form.escalas,morse:{...form.escalas.morse,h:v}}})}/> <CalcScaleRadio color="purple" label="Diagnóstico Secundário" options={morseFull.d} values={[0,15]} value={form.escalas.morse.d} onChange={v=>setForm({...form,escalas:{...form.escalas,morse:{...form.escalas.morse,d:v}}})}/> <CalcScaleRadio color="purple" label="Auxílio na Deambulação" options={morseFull.a} values={[0,15,30]} value={form.escalas.morse.a} onChange={v=>setForm({...form,escalas:{...form.escalas,morse:{...form.escalas.morse,a:v}}})}/> <CalcScaleRadio color="purple" label="Terapia Endovenosa" options={morseFull.t} values={[0,20]} value={form.escalas.morse.t} onChange={v=>setForm({...form,escalas:{...form.escalas,morse:{...form.escalas.morse,t:v}}})}/> <CalcScaleRadio color="purple" label="Marcha" options={morseFull.m} values={[0,10,20]} value={form.escalas.morse.m} onChange={v=>setForm({...form,escalas:{...form.escalas,morse:{...form.escalas.morse,m:v}}})}/> <CalcScaleRadio color="purple" label="Estado Mental" options={morseFull.e} values={[0,15]} value={form.escalas.morse.e} onChange={v=>setForm({...form,escalas:{...form.escalas,morse:{...form.escalas.morse,e:v}}})}/></div>}

                                                    {form.viasAereas.map(v=><div key={v.id} className="flex gap-2"><input className="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-white outline-none focus:border-blue-500" value={v.tipo} onChange={e=>setForm({...form,viasAereas:form.viasAereas.map(x=>x.id===v.id?{...x,tipo:e.target.value}:x)})} placeholder="Via Aérea"/><input className="w-24 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-white outline-none focus:border-blue-500 text-center" value={v.fixacao} onChange={e=>setForm({...form,viasAereas:form.viasAereas.map(x=>x.id===v.id?{...x,fixacao:e.target.value}:x)})} placeholder="Fixação(cm)"/><button onClick={()=>setForm({...form,viasAereas:form.viasAereas.filter(x=>x.id!==v.id)})} className="p-3 text-slate-500 hover:text-red-500 hover:bg-slate-900 rounded-lg transition-colors"><Icons.Trash size={16}/></button></div>)}
                                                    {form.eliminações.map(v=><div key={v.id} className="flex gap-2"><input className="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-white outline-none focus:border-blue-500" value={v.tipo} onChange={e=>setForm({...form,eliminações:form.eliminações.map(x=>x.id===v.id?{...x,tipo:e.target.value}:x)})} placeholder="Sonda/Dreno"/><input className="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-white outline-none focus:border-blue-500" value={v.aspecto} onChange={e=>setForm({...form,eliminações:form.eliminações.map(x=>x.id===v.id?{...x,aspecto:e.target.value}:x)})} placeholder="Aspecto (ex: Citrino)"/><input className="w-28 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-white outline-none focus:border-blue-500 text-center" value={v.debito} onChange={e=>setForm({...form,eliminações:form.eliminações.map(x=>x.id===v.id?{...x,debito:e.target.value}:x)})} placeholder="Débito(ml)"/><button onClick={()=>setForm({...form,eliminações:form.eliminações.filter(x=>x.id!==v.id)})} className="p-3 text-slate-500 hover:text-red-500 hover:bg-slate-900 rounded-lg transition-colors"><Icons.Trash size={16}/></button></div>)}

                                            <div className="max-h-80 overflow-y-auto custom-scrollbar pr-2 space-y-6">
                                                {nandaIntegral.map(c=>(
                                                    <div key={c.d}><div className="text-[10px] font-black uppercase text-slate-500 mb-3 border-l-2 border-emerald-500 pl-2">Domínio {c.d}: {c.name}</div><div className="flex flex-wrap gap-2">{c.diagnoses.filter(d=>d.toLowerCase().includes(searchTerm.toLowerCase())).map(d=><button key={d} onClick={()=>setForm(p=>({...p,diagnosticos:p.diagnosticos.includes(d)?p.diagnosticos.filter(x=>x!==d):[...p.diagnosticos,d]}))} className={`px-4 py-2 rounded-lg text-[10px] font-bold transition-all ${form.diagnosticos.includes(d)?'bg-emerald-600 text-white shadow-lg':'bg-slate-800 border border-slate-700 text-slate-300 hover:border-slate-500'}`}>{d}</button>)}</div></div>
                                                ))}
                                            </div>
                                            <div className="pt-4 border-t border-slate-800">
                                                <TextAreaField label="Raciocínio Clínico e Justificativas" h="h-32" value={form.interpretacao} onChange={v=>setForm({...form, interpretacao:v})} />
                                            </div>
                                        </div>
                                    )}
                                    {activeSection === 'C' && (
                                        <div className="space-y-6">
                                            <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                                                <div className="text-[10px] font-bold uppercase text-emerald-500 mb-4">Condutas Rápidas</div>
                                                <div className="flex flex-wrap gap-2 mb-4">{["Monitorar SSVV", "Troca de Decúbito 2/2h", "Controle Glicêmico", "Grades Elevadas", "Precaução de Contato", "Aspiração SOS"].map(c=><button key={c} onClick={()=>setForm(p=>({...p,condutas:p.condutas.includes(c)?p.condutas.filter(x=>x!==c):[...p.condutas,c]}))} className={`px-4 py-2 rounded-lg text-[10px] font-bold transition-all ${form.condutas.includes(c)?'bg-emerald-600 text-white shadow-lg':'bg-slate-900 border border-slate-700 text-slate-300 hover:border-slate-500'}`}>{c}</button>)}</div>
                                            </div>
                                            <TextAreaField label="Notas e Cuidados Específicos" h="h-48" value={form.obs} onChange={v=>setForm({...form, obs:v})} />

                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                    
                    <div className="hidden lg:flex w-[400px] xl:w-[450px] bg-slate-900 border border-slate-800 rounded-xl flex-col overflow-hidden shadow-2xl">
                        <div className="p-4 border-b border-slate-800 bg-slate-800 flex justify-between items-center"><div className="text-[10px] font-black uppercase text-emerald-400 tracking-widest flex items-center gap-2">Terminal AGHUse</div></div>
                        <div className="flex-1 p-4 overflow-hidden flex flex-col bg-slate-950">
                            <pre className="flex-1 bg-slate-900 border border-slate-800 rounded-xl p-4 text-[11px] font-mono text-emerald-400 overflow-y-auto custom-scrollbar whitespace-pre-wrap select-all leading-loose">{generateText()}</pre>
                            <button onClick={copyAghuse} className={`w-full py-4 mt-4 rounded-xl font-black text-[11px] uppercase tracking-widest transition-colors flex justify-center items-center gap-2 ${copySuccess?'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50':'bg-slate-800 hover:bg-slate-700 text-white border border-slate-700'}`}>{copySuccess?"Copiado para a Área de Transferência!":"Copiar Evolução"}</button>
                        </div>
                    </div>
                </div>
            );
        };

        // =====================================================================
        // APLICAÇÃO PRINCIPAL GESTÃO E ROTEAMENTO
        // =====================================================================
        const App = () => {
            const [db, setDb] = useState({ internados: {}, records: [] });
            const [isCloud, setIsCloud] = useState(false);

            const anosDisponiveis = [...new Set(PERIODOS.map(p => p.id.split('-')[0]))];
            const [anoSelecionado, setAnoSelecionado] = useState(anosDisponiveis[0] || '2026');
            
            const [openYears, setOpenYears] = useState({});

            const groupedPeriods = useMemo(() => {
                const groups = {};
                PERIODOS.forEach(p => {
                    const year = p.id.split('-')[0];
                    if (!groups[year]) groups[year] = [];
                    groups[year].push(p);
                });
                return groups;
            }, []);

            useEffect(() => {
                if (dbFS) {
                    setIsCloud(true);
                    const unsubRecords = dbFS.collection('records').onSnapshot(snap => {
                        const recs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setDb(prev => ({ ...prev, records: recs }));
                    });
                    const unsubInternados = dbFS.collection('internados').onSnapshot(snap => {
                        const ints = {}; snap.docs.forEach(doc => { ints[doc.id] = doc.data(); });
                        setDb(prev => ({ ...prev, internados: ints }));
                    });
                    return () => { unsubRecords(); unsubInternados(); };
                } else {
                    setIsCloud(false);
                    const saved = localStorage.getItem('auditoria_gtsae_haco');
                    if (saved) setDb(JSON.parse(saved));
                }
            }, []);

            useEffect(() => { if (!dbFS) localStorage.setItem('auditoria_gtsae_haco', JSON.stringify(db)); }, [db]);

            useEffect(() => {
                setOpenYears(prev => {
                    const next = { ...prev };
                    Object.keys(groupedPeriods).forEach(year => {
                        const isComplete = groupedPeriods[year].every(p => {
                            const intUPI = parseInt(db.internados[p.id]?.UPI);
                            const intUTI = parseInt(db.internados[p.id]?.UTI);
                            if (isNaN(intUPI) || isNaN(intUTI)) return false; 
                            const metaUPI = Math.ceil(intUPI * 0.4);
                            const metaUTI = Math.ceil(intUTI * 0.4);
                            const fUPI = db.records.filter(r => r.periodId === p.id && r.sector === 'UPI').length;
                            const fUTI = db.records.filter(r => r.periodId === p.id && r.sector === 'UTI').length;
                            return fUPI >= metaUPI && fUTI >= metaUTI;
                        });
                        if (next[year] === undefined) next[year] = !isComplete; 
                    });
                    return next;
                });
            }, [db.internados, db.records, groupedPeriods]);

            const [view, setView] = useState('DASHBOARD'); 
            const [selectedPeriod, setSelectedPeriod] = useState(null);
            const [selectedRecord, setSelectedRecord] = useState(null);

            const savePatientsCount = (periodId, sector, count) => {
                const val = parseInt(count) || 0;
                if (dbFS) dbFS.collection('internados').doc(periodId).set({ [sector]: val }, { merge: true });
                else setDb(prev => ({ ...prev, internados: { ...prev.internados, [periodId]: { ...(prev.internados[periodId] || {UPI:0, UTI:0}), [sector]: val } } }));
            };

            const createNewRecord = (periodId, sector) => {
                const newRecord = { periodId, sector, prontuario: '', auditor: AVALIADORES[0], date: new Date().toISOString().split('T')[0], answers: {} };
                if (dbFS) {
                    dbFS.collection('records').add(newRecord).then(docRef => { setSelectedRecord(docRef.id); setView('AVALIACAO'); });
                } else {
                    newRecord.id = Date.now().toString();
                    setDb(prev => ({ ...prev, records: [...prev.records, newRecord] }));
                    setSelectedRecord(newRecord.id); setView('AVALIACAO');
                }
            };

            const updateRecordMeta = (recordId, field, value) => {
                if (dbFS) dbFS.collection('records').doc(recordId).update({ [field]: value });
                else setDb(prev => ({ ...prev, records: prev.records.map(r => r.id === recordId ? { ...r, [field]: value } : r) }));
            };

            const answerQuestion = (recordId, questionId, value) => {
                if (dbFS) dbFS.collection('records').doc(recordId).set({ answers: { [questionId]: value } }, { merge: true });
                else setDb(prev => ({ ...prev, records: prev.records.map(r => r.id === recordId ? { ...r, answers: { ...r.answers, [questionId]: value } } : r) }));
            };

            const deleteRecord = (recordId) => {
                if(window.confirm("Confirmar exclusão?")) {
                    if (dbFS) dbFS.collection('records').doc(recordId).delete();
                    else setDb(prev => ({ ...prev, records: prev.records.filter(r => r.id !== recordId) }));
                }
            };

            const toggleYearDropdown = (year) => { setOpenYears(prev => ({ ...prev, [year]: !prev[year] })); };

            const renderAmostragemChart = (internados, avaliados, setor, labelPeriodo) => {
                const data = {
                    labels: [''], 
                    datasets: [
                        { label: `Nº pact internados ${setor} ${labelPeriodo}`, data: [internados || 0], backgroundColor: '#4285F4', barPercentage: 0.5 },
                        { label: `Nº pront avaliados ${labelPeriodo}`, data: [avaliados || 0], backgroundColor: '#EA4335', barPercentage: 0.5 }
                    ]
                };
                const options = {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'top', align: 'start', labels: { usePointStyle: true, boxWidth: 8, font: { size: 10 } } },
                        title: { display: true, text: `PACIENTES INTERNADOS NA ${setor}`, align: 'start', font: { size: 12, weight: 'bold' }, color: '#94a3b8' }
                    },
                    scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { stepSize: 1 } }, x: { grid: { display: false } } }
                };
                return (
                    <div className="bg-slate-800 p-5 rounded-md border border-slate-700 shadow flex flex-col h-[300px] print-bg-white print-break-avoid">
                        <div className="text-[10px] uppercase tracking-wider text-slate-400 mb-1 print-text-muted">AVALIAÇÃO DA SISTEMATIZAÇÃO DA ASSISTÊNCIA DE ENFERMAGEM (MÉTODOS-PRONTUÁRIO)</div>
                        <div className="flex-1"><ChartComponent type="bar" data={data} options={options} /></div>
                    </div>
                );
            };

            const renderFaltasChart = (qStats, section) => {
                const qs = qStats.filter(q => q.sec === section);
                const data = {
                    labels: qs.map(q => wrapText(q.text, 14)), 
                    datasets: [{ label: 'Porcentagem de Faltas', data: qs.map(q => q.pctFalta), backgroundColor: '#4285F4', barPercentage: 0.5 }]
                };
                const options = {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        title: { display: true, text: `${section} - Porcentagem de Faltas`, align: 'start', font: { size: 14, weight: 'bold' }, color: '#94a3b8' },
                        subtitle: { display: true, text: 'Com base no número de prontuários', align: 'start', font: { size: 10 }, color: '#64748b', padding: { bottom: 20 } },
                        tooltip: { callbacks: { title: (ctx) => `Q${qs[ctx[0].dataIndex].id}: ${qs[ctx[0].dataIndex].text}` } }
                    },
                    scales: { 
                        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.05)' } }, 
                        x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 0, minRotation: 0, autoSkip: false } }
                    }
                };
                return (
                    <div key={section} className="bg-slate-800 p-6 rounded-md border border-slate-700 shadow flex flex-col h-[480px] print-bg-white print-break-avoid w-full">
                        <div className="flex-1"><ChartComponent type="bar" data={data} options={options} /></div>
                    </div>
                );
            };

            const renderDashboard = () => {
                const { globalPct, totalNaoGeral } = calculateStats(db.records);
                return (
                    <div className="max-w-6xl mx-auto w-full pt-6 pb-12 space-y-8 animate-fade px-4 sm:px-6">
                        <header className="flex justify-between items-end border-b border-slate-700 pb-4 mb-6">
                            <div>
                                <h1 className="text-2xl font-bold text-white tracking-tight">Painel de Gestão SAE</h1>
                                <p className="text-sm text-slate-400 mt-1">GT SAE HACO - Hospital de Aeronáutica de Canoas</p>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className={`hidden md:flex text-[10px] font-bold uppercase px-3 py-1.5 rounded-full items-center gap-2 ${isCloud ? 'bg-emerald-900/50 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400 border border-slate-700'}`}>
                                    {isCloud ? <><Icons.Cloud/> Nuvem (Online)</> : <><Icons.Local/> Local (Offline)</>}
                                </span>
                                <button onClick={() => setView('COMPILADO_ANUAL')} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-md text-sm font-medium flex items-center gap-2 transition-colors shadow-lg">
                                    <Icons.Chart size={18}/> Relatório Anual
                                </button>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-slate-800 p-5 rounded-md border border-slate-700 shadow-sm">
                                <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Conformidade Global</div>
                                <div className="text-3xl font-bold text-blue-500">{globalPct}%</div>
                            </div>
                            <div className="bg-slate-800 p-5 rounded-md border border-slate-700 shadow-sm">
                                <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Total Auditado</div>
                                <div className="text-3xl font-bold text-slate-100">{db.records.length}</div>
                            </div>
                            <div className="bg-slate-800 p-5 rounded-md border border-slate-700 shadow-sm">
                                <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Não Conformidades</div>
                                <div className="text-3xl font-bold text-red-500">{totalNaoGeral}</div>
                            </div>
                        </div>

                        <div className="space-y-4 pt-2">
                            <h2 className="text-sm font-semibold uppercase tracking-wider text-slate-300 mb-4">Ciclos de Auditoria por Exercício</h2>
                            {Object.keys(groupedPeriods).sort((a,b) => b.localeCompare(a)).map(year => {
                                const isOpen = openYears[year];
                                const periods = groupedPeriods[year];
                                return (
                                    <div key={year} className="bg-slate-800 border border-slate-700 rounded-md overflow-hidden shadow-sm">
                                        <button onClick={() => toggleYearDropdown(year)} className="w-full flex items-center justify-between p-5 bg-slate-800 hover:bg-slate-700/80 transition-colors focus:outline-none">
                                            <div className="flex items-center gap-3">
                                                <Icons.Folder size={22} className="text-blue-500" />
                                                <span className="font-bold text-white text-lg tracking-wide">Exercício {year}</span>
                                                {!isOpen && <span className="ml-4 px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-900/50 text-emerald-400 border border-emerald-800/50 uppercase tracking-wider">Concluído</span>}
                                            </div>
                                            <div className={`transform transition-transform duration-300 ${isOpen ? 'rotate-180' : ''} text-slate-400`}><Icons.ChevronDown size={20} /></div>
                                        </button>
                                        {isOpen && (
                                            <div className="border-t border-slate-700 bg-slate-800/50 animate-fade">
                                                <table className="w-full text-left text-sm">
                                                    <thead className="bg-slate-900/80 border-b border-slate-700/80">
                                                        <tr><th className="p-4 font-semibold text-slate-400">Período de Avaliação</th><th className="p-4 font-semibold text-slate-400 text-center">Meta UPI</th><th className="p-4 font-semibold text-slate-400 text-center">Meta UTI</th><th className="p-4 font-semibold text-slate-400 text-right">Ação</th></tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-700/50">
                                                        {periods.map(p => {
                                                            const metaUPI = Math.ceil((db.internados[p.id]?.UPI || 0) * 0.4);
                                                            const metaUTI = Math.ceil((db.internados[p.id]?.UTI || 0) * 0.4);
                                                            const fUPI = db.records.filter(r => r.periodId === p.id && r.sector === 'UPI').length;
                                                            const fUTI = db.records.filter(r => r.periodId === p.id && r.sector === 'UTI').length;

                                                            return (
                                                                <tr key={p.id} className="hover:bg-slate-700/50 transition-colors">
                                                                    <td className="p-4 font-medium text-slate-200">{p.label}</td>
                                                                    <td className="p-4 text-center"><span className={`px-2.5 py-1 rounded text-xs font-medium ${fUPI >= metaUPI && metaUPI > 0 ? 'bg-emerald-900/50 text-emerald-400' : 'bg-slate-900 text-slate-400'}`}>{fUPI} / {metaUPI}</span></td>
                                                                    <td className="p-4 text-center"><span className={`px-2.5 py-1 rounded text-xs font-medium ${fUTI >= metaUTI && metaUTI > 0 ? 'bg-emerald-900/50 text-emerald-400' : 'bg-slate-900 text-slate-400'}`}>{fUTI} / {metaUTI}</span></td>
                                                                    <td className="p-4 text-right"><button onClick={() => { setSelectedPeriod(p.id); setView('PERIODO'); }} className="text-blue-500 hover:text-blue-400 font-medium text-sm transition-colors">Abrir Pasta</button></td>
                                                                </tr>
                                                            )
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                );
            };

            const renderPeriodo = () => {
                const p = PERIODOS.find(x => x.id === selectedPeriod);
                const intUPI = db.internados[p.id]?.UPI || '';
                const intUTI = db.internados[p.id]?.UTI || '';
                const mUPI = Math.ceil((parseInt(intUPI) || 0) * 0.4);
                const mUTI = Math.ceil((parseInt(intUTI) || 0) * 0.4);
                const recs = db.records.filter(r => r.periodId === p.id);

                return (
                    <div className="max-w-6xl mx-auto w-full pt-6 pb-12 space-y-8 animate-fade px-4 sm:px-6">
                        <header className="flex items-center justify-between border-b border-slate-700 pb-4 mb-6">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setView('DASHBOARD')} className="text-slate-400 hover:text-white transition-colors"><Icons.Back /></button>
                                <div><h1 className="text-xl font-bold text-white">Auditoria: {p.label}</h1></div>
                            </div>
                            <button onClick={() => setView('COMPILADO_PERIODO')} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2 transition-colors">
                                <Icons.Chart size={16}/> Relatório do Mês
                            </button>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-slate-800 p-5 rounded-md border border-slate-700 shadow-sm">
                                <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4 border-l-2 border-blue-500 pl-2">Metas UPI</div>
                                <div className="flex gap-4 items-end">
                                    <div className="flex-1"><label className="text-xs text-slate-400 block mb-1">Pacientes Internados</label><input type="number" className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white outline-none focus:border-blue-500" value={intUPI} onChange={e => savePatientsCount(p.id, 'UPI', e.target.value)} /></div>
                                    <div className="flex-1"><label className="text-xs text-slate-400 block mb-1">Amostra Mín (40%)</label><div className="w-full bg-slate-900 border border-slate-800 rounded px-3 py-2 text-slate-400 font-medium">{mUPI}</div></div>
                                </div>
                                <button onClick={() => createNewRecord(p.id, 'UPI')} className="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-sm font-medium transition-colors shadow-sm">Nova Auditoria UPI</button>
                            </div>
                            <div className="bg-slate-800 p-5 rounded-md border border-slate-700 shadow-sm">
                                <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4 border-l-2 border-red-500 pl-2">Metas UTI</div>
                                <div className="flex gap-4 items-end">
                                    <div className="flex-1"><label className="text-xs text-slate-400 block mb-1">Pacientes Internados</label><input type="number" className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white outline-none focus:border-blue-500" value={intUTI} onChange={e => savePatientsCount(p.id, 'UTI', e.target.value)} /></div>
                                    <div className="flex-1"><label className="text-xs text-slate-400 block mb-1">Amostra Mín (40%)</label><div className="w-full bg-slate-900 border border-slate-800 rounded px-3 py-2 text-slate-400 font-medium">{mUTI}</div></div>
                                </div>
                                <button onClick={() => createNewRecord(p.id, 'UTI')} className="mt-4 w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded text-sm font-medium transition-colors shadow-sm">Nova Auditoria UTI</button>
                            </div>
                        </div>

                        <div className="bg-slate-800 border border-slate-700 rounded-md overflow-hidden mt-6">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-900 border-b border-slate-700">
                                    <tr><th className="p-4 font-semibold text-slate-400">Setor</th><th className="p-4 font-semibold text-slate-400">Prontuário</th><th className="p-4 font-semibold text-slate-400">Auditor</th><th className="p-4 font-semibold text-slate-400">Progresso</th><th className="p-4 font-semibold text-slate-400 text-right">Ações</th></tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700">
                                    {recs.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-500">Nenhuma avaliação iniciada.</td></tr>}
                                    {recs.map(r => {
                                        const progress = Math.round((Object.keys(r.answers).length / 32) * 100);
                                        return (
                                            <tr key={r.id} className="hover:bg-slate-700/30 transition-colors">
                                                <td className="p-4"><span className={`px-2 py-1 text-[10px] font-bold rounded ${r.sector==='UPI' ? 'bg-blue-900/50 text-blue-400' : 'bg-red-900/50 text-red-400'}`}>{r.sector}</span></td>
                                                <td className="p-4 font-medium text-slate-200">{r.prontuario || '-'}</td>
                                                <td className="p-4 text-slate-400">{r.auditor}</td>
                                                <td className="p-4"><div className="flex items-center gap-2"><div className="w-24 h-1.5 bg-slate-900 rounded-full overflow-hidden"><div className="h-full bg-blue-500" style={{width: `${progress}%`}}></div></div><span className="text-[10px] text-slate-400">{progress}%</span></div></td>
                                                <td className="p-4 text-right flex justify-end gap-3"><button onClick={() => { setSelectedRecord(r.id); setView('AVALIACAO'); }} className="text-blue-500 hover:text-blue-400 font-medium text-sm">Editar</button><button onClick={() => deleteRecord(r.id)} className="text-slate-500 hover:text-red-500"><Icons.Trash /></button></td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                )
            };

            const renderAvaliacao = () => {
                const rec = db.records.find(x => x.id === selectedRecord);
                if(!rec) return null;
                const sections = [...new Set(PERGUNTAS_AUDITORIA.map(q => q.sec))];

                return (
                    <div className="max-w-4xl mx-auto w-full pt-6 pb-12 space-y-8 animate-fade px-4 sm:px-6">
                        <header className="flex items-center justify-between border-b border-slate-700 pb-4 mb-6 sticky top-0 bg-[#0f172a] pt-4 z-10">
                            <div className="flex items-center gap-4">
                                <h1 className="text-xl font-bold text-white">Formulário de Auditoria</h1>
                                <span className={`px-2 py-1 text-[10px] font-bold rounded ${rec.sector==='UPI' ? 'bg-blue-900/50 text-blue-400' : 'bg-red-900/50 text-red-400'}`}>{rec.sector}</span>
                            </div>
                            <button onClick={() => setView('PERIODO')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-md text-sm font-medium flex items-center gap-2 transition-colors">
                                <Icons.Save size={16}/> Salvar Avaliação
                            </button>
                        </header>

                        <div className="bg-slate-800 p-5 rounded-md border border-slate-700 grid grid-cols-1 md:grid-cols-3 gap-4 shadow-sm">
                            <div><label className="text-xs text-slate-400 block mb-1">Nº Prontuário</label><input className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white outline-none focus:border-blue-500 text-sm" value={rec.prontuario} onChange={e => updateRecordMeta(rec.id, 'prontuario', e.target.value)} /></div>
                            <div><label className="text-xs text-slate-400 block mb-1">Auditor</label><select className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white outline-none focus:border-blue-500 text-sm" value={rec.auditor} onChange={e => updateRecordMeta(rec.id, 'auditor', e.target.value)}>{AVALIADORES.map(a => <option key={a} value={a}>{a}</option>)}</select></div>
                            <div><label className="text-xs text-slate-400 block mb-1">Data</label><input type="date" className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white outline-none focus:border-blue-500 text-sm" value={rec.date} onChange={e => updateRecordMeta(rec.id, 'date', e.target.value)} /></div>
                        </div>

                        <div className="space-y-8">
                            {sections.map(sec => {
                                const qs = PERGUNTAS_AUDITORIA.filter(q => q.sec === sec);
                                return (
                                    <div key={sec} className="bg-slate-800 border border-slate-700 rounded-md overflow-hidden shadow-sm">
                                        <div className="bg-slate-900 px-4 py-3 border-b border-slate-700 text-xs font-semibold uppercase text-slate-300">{sec}</div>
                                        <div className="divide-y divide-slate-700/50">
                                            {qs.map(q => (
                                                <div key={q.id} className="p-4 flex flex-col md:flex-row justify-between md:items-center gap-4 hover:bg-slate-700/20 transition-colors">
                                                    <div className="text-sm text-slate-200 flex-1"><span className="text-slate-500 mr-2">{q.id}.</span> {q.text}</div>
                                                    <div className="flex gap-1 shrink-0 bg-slate-900 p-1 rounded-md border border-slate-700">
                                                        <button onClick={() => answerQuestion(rec.id, q.id, 'SIM')} className={`px-4 py-1.5 rounded text-xs font-medium transition-colors ${rec.answers[q.id] === 'SIM' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>SIM</button>
                                                        <button onClick={() => answerQuestion(rec.id, q.id, 'NÃO')} className={`px-4 py-1.5 rounded text-xs font-medium transition-colors ${rec.answers[q.id] === 'NÃO' ? 'bg-amber-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>NÃO</button>
                                                        <button onClick={() => answerQuestion(rec.id, q.id, 'NA')} className={`px-4 py-1.5 rounded text-xs font-medium transition-colors ${rec.answers[q.id] === 'NA' ? 'bg-slate-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>N/A</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                );
            };

            const renderCompiladoPeriodo = () => {
                const p = PERIODOS.find(x => x.id === selectedPeriod);
                const intUPI = parseInt(db.internados[p.id]?.UPI) || 0;
                const intUTI = parseInt(db.internados[p.id]?.UTI) || 0;
                const recsUPI = db.records.filter(r => r.periodId === p.id && r.sector === 'UPI');
                const recsUTI = db.records.filter(r => r.periodId === p.id && r.sector === 'UTI');
                const recs = [...recsUPI, ...recsUTI];
                
                const { qStats, sections } = calculateStats(recs);

                return (
                    <div className="max-w-6xl mx-auto w-full pt-6 pb-12 space-y-8 animate-fade px-4 sm:px-6 print-container">
                        <header className="flex justify-between items-end border-b border-slate-700 pb-4 mb-6">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setView('PERIODO')} className="text-slate-400 hover:text-white transition-colors no-print"><Icons.Back /></button>
                                <div><h1 className="text-2xl font-bold text-white print-text-dark">Relatório de Faltas do Período</h1><p className="text-sm text-slate-400 mt-1">{p.label}</p></div>
                            </div>
                            <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2 transition-colors no-print"><Icons.Pdf size={16}/> Gerar PDF</button>
                        </header>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {renderAmostragemChart(intUPI, recsUPI.length, 'UPI', p.label)}
                            {renderAmostragemChart(intUTI, recsUTI.length, 'UTI', p.label)}
                        </div>
                        <div className="grid grid-cols-1 gap-6 pt-4">
                            {sections.map(sec => renderFaltasChart(qStats, sec))}
                        </div>
                    </div>
                );
            };

            const renderCompiladoAnual = () => {
                const periodosDoAno = PERIODOS.filter(p => p.id.startsWith(anoSelecionado));
                const recordsDoAno = db.records.filter(r => periodosDoAno.some(p => p.id === r.periodId));
                
                const { qStats, globalPct, sections } = calculateStats(recordsDoAno);

                let totalIntUPI = 0, totalIntUTI = 0, totalAvUPI = 0, totalAvUTI = 0;
                periodosDoAno.forEach(p => {
                    totalIntUPI += parseInt(db.internados[p.id]?.UPI) || 0;
                    totalIntUTI += parseInt(db.internados[p.id]?.UTI) || 0;
                    totalAvUPI += db.records.filter(r => r.periodId === p.id && r.sector === 'UPI').length;
                    totalAvUTI += db.records.filter(r => r.periodId === p.id && r.sector === 'UTI').length;
                });

                return (
                    <div className="max-w-6xl mx-auto w-full pt-6 pb-12 space-y-8 animate-fade px-4 sm:px-6 print-container">
                        <header className="flex justify-between items-end border-b border-slate-700 pb-4 mb-6">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setView('DASHBOARD')} className="text-slate-400 hover:text-white transition-colors no-print"><Icons.Back /></button>
                                <div>
                                    <h1 className="text-2xl font-bold text-white print-text-dark">Relatório Anual Consolidado</h1>
                                    <div className="flex items-center gap-4 mt-2">
                                        <p className="text-sm text-slate-400">GT SAE HACO</p>
                                        <select className="bg-slate-800 border border-slate-700 text-white text-xs rounded px-2 py-1 outline-none no-print focus:border-blue-500" value={anoSelecionado} onChange={(e) => setAnoSelecionado(e.target.value)}>
                                            {anosDisponiveis.map(a => <option key={a} value={a}>Ano {a}</option>)}
                                        </select>
                                        <span className="hidden print:inline print-text-muted font-bold ml-2"> - Exercício {anoSelecionado}</span>
                                    </div>
                                </div>
                            </div>
                            <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2 transition-colors no-print"><Icons.Pdf size={16}/> Gerar PDF</button>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {renderAmostragemChart(totalIntUPI, totalAvUPI, 'UPI', `(Acumulado ${anoSelecionado})`)}
                            {renderAmostragemChart(totalIntUTI, totalAvUTI, 'UTI', `(Acumulado ${anoSelecionado})`)}
                        </div>
                        <div className="grid grid-cols-1 gap-6 pt-4">
                            {sections.map(sec => renderFaltasChart(qStats, sec))}
                        </div>
                    </div>
                );
            };

            const MobileNav = () => (
                <div className="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around items-center h-16 z-50 px-2 pb-safe no-print">
                    <button onClick={() => setView('DASHBOARD')} className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${view === 'DASHBOARD' || view === 'COMPILADO_ANUAL' ? 'text-blue-500' : 'text-slate-500 hover:text-white'}`}><Icons.Dashboard /> <span className="text-[8px] font-bold mt-1">Painel</span></button>
                    <button onClick={() => setView('CALCULADORAS')} className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${view === 'CALCULADORAS' ? 'text-amber-500' : 'text-slate-500 hover:text-white'}`}><Icons.Calculator /> <span className="text-[8px] font-bold mt-1">Escalas</span></button>
                    {selectedPeriod && <button onClick={() => setView('PERIODO')} className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${view === 'PERIODO' || view === 'COMPILADO_PERIODO' ? 'text-blue-500' : 'text-slate-500 hover:text-white'}`}><Icons.Folder /> <span className="text-[8px] font-bold mt-1">Amostra</span></button>}
                    {selectedRecord && <button onClick={() => setView('AVALIACAO')} className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${view === 'AVALIACAO' ? 'text-blue-500' : 'text-slate-500 hover:text-white'}`}><Icons.FileEdit /> <span className="text-[8px] font-bold mt-1">Auditoria</span></button>}
                    <button onClick={() => setView('SOIC')} className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${view === 'SOIC' ? 'text-emerald-500' : 'text-slate-500 hover:text-white'}`}><Icons.Activity /> <span className="text-[8px] font-bold mt-1">SOIC</span></button>
                </div>
            );

            return (
                <div className="flex h-screen bg-slate-950 overflow-hidden">
                    <div className="hidden lg:flex w-64 bg-slate-900 border-r border-slate-800 flex-col no-print shrink-0 z-50">
                        <div className="h-16 flex items-center justify-start px-6 border-b border-slate-800">
                            <Icons.Shield size={24} className="text-blue-500 shrink-0" />
                            <span className="ml-3 font-bold text-white tracking-wide">GT SAE HACO</span>
                        </div>
                        <div className="p-4 flex flex-col gap-2 flex-1">
                            <button onClick={() => setView('DASHBOARD')} className={`flex items-center justify-start gap-3 p-3 rounded-md transition-colors ${view === 'DASHBOARD' || view === 'COMPILADO_ANUAL' ? 'bg-blue-600/10 text-blue-500 border border-blue-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                <Icons.Dashboard /> <span className="text-sm font-medium">Dashboard</span>
                            </button>
                            {selectedPeriod && (
                                <button onClick={() => setView('PERIODO')} className={`flex items-center justify-start gap-3 p-3 rounded-md transition-colors ${view === 'PERIODO' || view === 'COMPILADO_PERIODO' ? 'bg-blue-600/10 text-blue-500 border border-blue-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    <Icons.Folder /> <span className="text-sm font-medium">Período Ativo</span>
                                </button>
                            )}
                            {selectedRecord && (
                                <button onClick={() => setView('AVALIACAO')} className={`flex items-center justify-start gap-3 p-3 rounded-md transition-colors ${view === 'AVALIACAO' ? 'bg-blue-600/10 text-blue-500 border border-blue-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    <Icons.FileEdit /> <span className="text-sm font-medium">Auditoria Atual</span>
                                </button>
                            )}
                            
                            <div className="my-2 border-t border-slate-800"></div>
                            
                            <button onClick={() => setView('CALCULADORAS')} className={`flex items-center justify-start gap-3 p-3 rounded-md transition-colors ${view === 'CALCULADORAS' ? 'bg-amber-600/10 text-amber-500 border border-amber-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-amber-400'}`}>
                                <Icons.Calculator /> <span className="text-sm font-medium">Calculadora de Escalas</span>
                            </button>
                            <button onClick={() => setView('SOIC')} className={`flex items-center justify-start gap-3 p-3 rounded-md transition-colors ${view === 'SOIC' ? 'bg-emerald-600/10 text-emerald-500 border border-emerald-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-emerald-400'}`}>
                                <Icons.Activity /> <span className="text-sm font-medium">Assistente Clínico SOIC</span>
                            </button>
                        </div>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto h-full relative custom-scrollbar bg-slate-950 pb-20 lg:pb-0">
                        {view === 'DASHBOARD' && renderDashboard()}
                        {view === 'PERIODO' && renderPeriodo()}
                        {view === 'AVALIACAO' && renderAvaliacao()}
                        {view === 'COMPILADO_PERIODO' && renderCompiladoPeriodo()}
                        {view === 'COMPILADO_ANUAL' && renderCompiladoAnual()}
                        
                        {/* MÓDULO CALCULADORAS ISOLADAS */}
                        {view === 'CALCULADORAS' && (
                            <div className="h-full py-6 md:py-8">
                                <CalculadorasApp />
                            </div>
                        )}

                        {/* MÓDULO ISOLADO SOIC */}
                        {view === 'SOIC' && (
                            <div className="h-full p-4 md:p-6 lg:p-8 max-w-[1600px] mx-auto animate-fade flex flex-col">
                                <header className="flex items-center gap-4 mb-6 shrink-0">
                                    <div className="p-3 bg-slate-800 border border-slate-700 rounded-xl"><Icons.Activity size={24} className="text-emerald-500"/></div>
                                    <div>
                                        <h1 className="text-xl md:text-2xl font-bold text-white tracking-tight">Assistente SOIC</h1>
                                        <p className="text-[11px] font-bold uppercase tracking-widest text-slate-400 mt-1">Ferramenta Clínica - GT SAE HACO</p>
                                    </div>
                                </header>
                                <div className="flex-1 overflow-hidden">
                                    <SoicApp />
                                </div>
                            </div>
                        )}
                    </div>
                    <MobileNav />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
