<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSAE HACO - Gestão de Auditoria SAE</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- CONFIGURAÇÃO GLOBAL DO CHART.JS ---
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = 'Inter';

        // --- ÍCONES ---
        const Icons = {
            Shield: ({size=24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            Dashboard: ({size=24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>,
            FileCheck: ({size=24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 12"/></svg>,
            Chart: ({size=24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
            ActivityDoc: ({size=24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="16 13 12.5 13 11 16 9 11 7.5 13 6 13"/></svg>,
            Back: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>,
            Check: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
            X: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Minus: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Trash: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Download: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            Upload: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            ClipboardCheck: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><polyline points="9 14 11 16 15 12"/></svg>,
            Table: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        };

        // --- DADOS DA PLANILHA (MÉTODOS - PRONTUÁRIO) ---
        const AVALIADORES = [
            "Ten Cimirro", "Ten Bárbara Viegas", "Ten Renata", 
            "Ten Jéssica Cunha", "Ten Zomer", "Sgt Leonarczyk", "Sgt Thamires Queiroz"
        ];

        const PERIODOS = [
            { id: '2026-08', label: '15/08/2026 a 14/09/2026', short: 'Ago/Set' },
            { id: '2026-09', label: '15/09/2026 a 14/10/2026', short: 'Set/Out' },
            { id: '2026-10', label: '15/10/2026 a 14/11/2026', short: 'Out/Nov' },
            { id: '2026-11', label: '15/11/2026 a 14/12/2026', short: 'Nov/Dez' },
            { id: '2026-12', label: '15/12/2026 a 14/01/2027', short: 'Dez/Jan' }
        ];

        const PERGUNTAS_AUDITORIA = [
            { id: 1, sec: "Histórico de Enfermagem", text: "Possui Histórico de Enfermagem na admissão hospitalar?" },
            { id: 2, sec: "Histórico de Enfermagem", text: "Possui identificação completa do paciente?" },
            { id: 3, sec: "Histórico de Enfermagem", text: "O formulário foi completamente preenchido?" },
            { id: 4, sec: "Histórico de Enfermagem", text: "Possui registro do exame físico?" },
            { id: 5, sec: "Histórico de Enfermagem", text: "O formulário encontra-se devidamente carimbado e assinado?" },
            { id: 6, sec: "Diagnóstico de Enfermagem", text: "Possui Diagnóstico de Enfermagem?" },
            { id: 7, sec: "Diagnóstico de Enfermagem", text: "Possui identificação completa do paciente?" },
            { id: 8, sec: "Diagnóstico de Enfermagem", text: "O formulário encontra-se devidamente carimbado e assinado?" },
            { id: 9, sec: "Diagnóstico de Enfermagem", text: "Possui Diagnósticos de Enfermagem na SAE Perioperatória?" },
            { id: 10, sec: "Planejamento de Enfermagem", text: "Observa-se o estabelecimento de Diagnósticos prioritários na Evolução?" },
            { id: 11, sec: "Planejamento de Enfermagem", text: "São determinados os resultados esperados, na Evolução de Enfermagem?" },
            { id: 12, sec: "Planejamento de Enfermagem", text: "Os resultados esperados são compatíveis com os Diagnósticos?" },
            { id: 13, sec: "Planejamento de Enfermagem", text: "São determinados os prazos para a resolução dos problemas encontrados?" },
            { id: 14, sec: "Planejamento de Enfermagem", text: "O formulário encontra-se devidamente carimbado e assinado?" },
            { id: 15, sec: "Implementação", text: "São elaboradas as Prescrições de Enfermagem na admissão e diariamente?" },
            { id: 16, sec: "Implementação", text: "As Prescrições são compatíveis com os Diagnósticos de Enfermagem?" },
            { id: 17, sec: "Implementação", text: "Possui Prescrições de Enfermagem adicionais?" },
            { id: 18, sec: "Implementação", text: "As Prescrições de Enfermagem são aprazadas adequadamente?" },
            { id: 19, sec: "Implementação", text: "As Prescrições são checadas nos horários aprazados?" },
            { id: 20, sec: "Implementação", text: "A Prescrição encontra-se devidamente carimbada e assinada?" },
            { id: 21, sec: "Implementação", text: "Possui Prescrições na SAE Perioperatória?" },
            { id: 22, sec: "Implementação", text: "O formulário da SAE Perioperatória encontra-se devidamente carimbado e assinado?" },
            { id: 23, sec: "Avaliação e Anotações", text: "Os resultados avaliados são compatíveis com a Prescrição de Enfermagem?" },
            { id: 24, sec: "Avaliação e Anotações", text: "Possui Evolução de Enfermagem diária?" },
            { id: 25, sec: "Avaliação e Anotações", text: "As Evoluções apresentam a avaliação do estado geral do paciente?" },
            { id: 26, sec: "Avaliação e Anotações", text: "Em caso de transferência, há Evolução do setor de origem e de destino?" },
            { id: 27, sec: "Avaliação e Anotações", text: "Em caso de óbito, há evolução de enfermagem relativa ao ocorrido?" },
            { id: 28, sec: "Avaliação e Anotações", text: "A Evolução de Enfermagem encontra-se devidamente carimbada e assinada?" },
            { id: 29, sec: "Avaliação e Anotações", text: "São registradas anotações de Enfermagem?" },
            { id: 30, sec: "Avaliação e Anotações", text: "As Anotações de Enfermagem encontram-se devidamente carimbadas e assinadas?" },
            { id: 31, sec: "Avaliação e Anotações", text: "São registradas anotações no formulário da SRPA?" },
            { id: 32, sec: "Avaliação e Anotações", text: "As Anotações da SRPA encontram-se devidamente carimbadas e assinadas?" }
        ];

        // --- COMPONENTE CHART.JS ---
        const ChartComponent = ({ type, data, options, height = "250px" }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            React.useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, { type, data, options });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data, options, type]);
            return <div style={{ position: 'relative', height, width: '100%' }}><canvas ref={chartRef}></canvas></div>;
        };

        // --- MOTOR ANALÍTICO ---
        const calculateStats = (recordsToAnalyze) => {
            const qStats = PERGUNTAS_AUDITORIA.map(q => {
                let sim = 0, nao = 0, na = 0;
                recordsToAnalyze.forEach(r => {
                    const a = r.answers[q.id];
                    if(a === 'SIM') sim++; else if(a === 'NÃO') nao++; else if(a === 'NA') na++;
                });
                const totalValido = sim + nao;
                const pct = totalValido > 0 ? Math.round((sim / totalValido) * 100) : 0;
                const pctFalta = totalValido > 0 ? Math.round((nao / totalValido) * 100) : 0; 
                return { ...q, sim, nao, na, pct, pctFalta, totalValido };
            });

            let totalSimGeral = 0, totalNaoGeral = 0;
            qStats.forEach(s => { totalSimGeral += s.sim; totalNaoGeral += s.nao; });
            const globalPct = (totalSimGeral + totalNaoGeral) > 0 ? Math.round((totalSimGeral / (totalSimGeral + totalNaoGeral)) * 100) : 0;
            const sections = [...new Set(PERGUNTAS_AUDITORIA.map(q => q.sec))];
            
            return { qStats, globalPct, totalSimGeral, totalNaoGeral, sections };
        };

        // --- APLICAÇÃO PRINCIPAL ---
        const App = () => {
            const [db, setDb] = useState(() => {
                const saved = localStorage.getItem('auditoria_csae_haco');
                return saved ? JSON.parse(saved) : { internados: {}, records: [] };
            });

            React.useEffect(() => { localStorage.setItem('auditoria_csae_haco', JSON.stringify(db)); }, [db]);

            const [view, setView] = useState('DASHBOARD'); // DASHBOARD, PERIODO, AVALIACAO, COMPILADO_PERIODO, COMPILADO_ANUAL
            const [selectedPeriod, setSelectedPeriod] = useState(null);
            const [selectedRecord, setSelectedRecord] = useState(null);

            // --- AÇÕES DO BANCO DE DADOS ---
            const savePatientsCount = (periodId, sector, count) => {
                setDb(prev => ({ ...prev, internados: { ...prev.internados, [periodId]: { ...(prev.internados[periodId] || {UPI:0, UTI:0}), [sector]: parseInt(count) || 0 } } }));
            };

            const createNewRecord = (periodId, sector) => {
                const newRecord = { id: Date.now().toString(), periodId, sector, prontuario: '', auditor: AVALIADORES[0], date: new Date().toISOString().split('T')[0], answers: {} };
                setDb(prev => ({ ...prev, records: [...prev.records, newRecord] }));
                setSelectedRecord(newRecord.id);
                setView('AVALIACAO');
            };

            const updateRecordMeta = (recordId, field, value) => {
                setDb(prev => ({ ...prev, records: prev.records.map(r => r.id === recordId ? { ...r, [field]: value } : r) }));
            };

            const answerQuestion = (recordId, questionId, value) => {
                setDb(prev => ({ ...prev, records: prev.records.map(r => r.id === recordId ? { ...r, answers: { ...r.answers, [questionId]: value } } : r) }));
            };

            const deleteRecord = (recordId) => {
                if(window.confirm("Confirmar exclusão desta auditoria?")) {
                    setDb(prev => ({ ...prev, records: prev.records.filter(r => r.id !== recordId) }));
                }
            };

            const exportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
                const a = document.createElement('a'); a.href = dataStr; a.download = `Auditoria_CSAE_HACO_${new Date().toISOString().split('T')[0]}.json`; a.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const imported = JSON.parse(ev.target.result);
                            if(imported.internados && imported.records) { setDb(imported); alert("Dados restaurados com sucesso!"); }
                            else alert("Arquivo inválido.");
                        } catch (err) { alert("Erro ao ler o arquivo."); }
                    };
                    reader.readAsText(file);
                }
            };

            // --- GRÁFICOS REUTILIZÁVEIS ---
            const renderAmostragemChart = (internados, avaliados, title) => {
                const data = {
                    labels: [`Internados`, `Avaliados`],
                    datasets: [{
                        data: [internados || 0, avaliados || 0],
                        backgroundColor: ['#3b82f6', '#ef4444'], // Azul (Internados) e Vermelho (Avaliados)
                        borderRadius: 4
                    }]
                };
                const options = {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { color: '#1e293b' }, ticks: { precision: 0 } }, x: { grid: { display: false } } }
                };
                return (
                    <div className="bg-slate-900 p-6 rounded-[2rem] border border-slate-800 shadow-xl flex flex-col">
                        <div className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4">{title}</div>
                        <div className="flex-1 min-h-[250px]">
                            <ChartComponent type="bar" data={data} options={options} height="100%" />
                        </div>
                    </div>
                );
            };

            const renderFaltasChart = (qStats, section) => {
                const qs = qStats.filter(q => q.sec === section);
                const data = {
                    labels: qs.map(q => `Q${q.id}`),
                    datasets: [{
                        label: 'Porcentagem de Faltas (%)',
                        data: qs.map(q => q.pctFalta),
                        backgroundColor: '#3b82f6', 
                        borderRadius: 4
                    }]
                };
                const options = {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: (ctx) => `Q${qs[ctx[0].dataIndex].id}: ${qs[ctx[0].dataIndex].text}`
                            }
                        }
                    },
                    scales: { y: { beginAtZero: true, max: 100, grid: { color: '#1e293b' } }, x: { grid: { display: false } } }
                };
                return (
                    <div key={section} className="bg-slate-900 p-6 rounded-[2rem] border border-slate-800 shadow-xl flex flex-col">
                        <div className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4">{section} - Faltas (%)</div>
                        <div className="flex-1 min-h-[200px]">
                            <ChartComponent type="bar" data={data} options={options} height="100%" />
                        </div>
                    </div>
                );
            };

            // --- TELAS ---

            const renderDashboard = () => {
                const { globalPct, totalNaoGeral } = calculateStats(db.records);
                return (
                    <div className="space-y-6 md:space-y-8 animate-fade max-w-7xl mx-auto p-4 md:p-8">
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-b border-slate-800 pb-8">
                            <div>
                                <h1 className="text-3xl font-black uppercase italic tracking-tighter">Auditoria SAE (Planilha)</h1>
                                <p className="text-blue-500 font-bold uppercase tracking-[0.2em] text-[10px] mt-2">Hospital de Aeronáutica de Canoas</p>
                            </div>
                            <div className="flex flex-wrap gap-4 w-full md:w-auto">
                                <button onClick={() => setView('COMPILADO_ANUAL')} className="flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-2xl text-[10px] font-black uppercase shadow-lg shadow-blue-900/20 transition-all"><Icons.Chart/> Relatório Anual (Gráficos)</button>
                                <button onClick={exportData} className="flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-3 bg-slate-900 border border-slate-700 hover:bg-slate-800 rounded-2xl text-[10px] font-bold uppercase transition-all"><Icons.Download/> Backup</button>
                                <label className="flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-3 bg-slate-900 border border-slate-700 hover:bg-slate-800 rounded-2xl text-[10px] font-bold uppercase transition-all cursor-pointer">
                                    <Icons.Upload/> Importar
                                    <input type="file" accept=".json" onChange={importData} className="hidden" />
                                </label>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-slate-900 p-8 rounded-[2rem] border border-slate-800 shadow-xl">
                                <div className="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-2">Conformidade Anual Global</div>
                                <div className="text-5xl font-black text-blue-500">{globalPct}%</div>
                            </div>
                            <div className="bg-slate-900 p-8 rounded-[2rem] border border-slate-800 shadow-xl">
                                <div className="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-2">Prontuários Auditados</div>
                                <div className="text-5xl font-black text-white">{db.records.length}</div>
                            </div>
                            <div className="bg-slate-900 p-8 rounded-[2rem] border border-slate-800 shadow-xl">
                                <div className="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-2">Não Conformidades (NÃO)</div>
                                <div className="text-5xl font-black text-red-500">{totalNaoGeral}</div>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <h2 className="text-sm font-black uppercase tracking-widest text-slate-500">Ciclos de Auditoria</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {PERIODOS.map(p => {
                                    const metaUPI = Math.ceil((db.internados[p.id]?.UPI || 0) * 0.4);
                                    const metaUTI = Math.ceil((db.internados[p.id]?.UTI || 0) * 0.4);
                                    const feitosUPI = db.records.filter(r => r.periodId === p.id && r.sector === 'UPI').length;
                                    const feitosUTI = db.records.filter(r => r.periodId === p.id && r.sector === 'UTI').length;

                                    return (
                                        <button key={p.id} onClick={() => { setSelectedPeriod(p.id); setView('PERIODO'); }} className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 hover:border-blue-600 transition-all text-left flex justify-between items-center group shadow-lg">
                                            <div>
                                                <div className="text-xl font-black text-white">{p.label}</div>
                                                <div className="flex gap-4 mt-3">
                                                    <span className={`text-[10px] font-bold px-3 py-1 rounded-full ${feitosUPI >= metaUPI && metaUPI > 0 ? 'bg-green-600/20 text-green-500' : 'bg-slate-800 text-slate-400'}`}>UPI: {feitosUPI}/{metaUPI}</span>
                                                    <span className={`text-[10px] font-bold px-3 py-1 rounded-full ${feitosUTI >= metaUTI && metaUTI > 0 ? 'bg-green-600/20 text-green-500' : 'bg-slate-800 text-slate-400'}`}>UTI: {feitosUTI}/{metaUTI}</span>
                                                </div>
                                            </div>
                                            <div className="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center group-hover:bg-blue-600 transition-colors text-slate-400 group-hover:text-white">
                                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="9 18 15 12 9 6"/></svg>
                                            </div>
                                        </button>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderPeriodo = () => {
                const p = PERIODOS.find(x => x.id === selectedPeriod);
                const internadosUPI = db.internados[p.id]?.UPI || '';
                const internadosUTI = db.internados[p.id]?.UTI || '';
                const metaUPI = Math.ceil((parseInt(internadosUPI) || 0) * 0.4);
                const metaUTI = Math.ceil((parseInt(internadosUTI) || 0) * 0.4);
                
                const recsUPI = db.records.filter(r => r.periodId === p.id && r.sector === 'UPI');
                const recsUTI = db.records.filter(r => r.periodId === p.id && r.sector === 'UTI');

                return (
                    <div className="space-y-8 animate-fade max-w-7xl mx-auto p-4 md:p-8">
                        <header className="flex items-center gap-6 border-b border-slate-800 pb-8">
                            <button onClick={() => setView('DASHBOARD')} className="p-4 bg-slate-900 hover:bg-slate-800 rounded-2xl transition-colors"><Icons.Back /></button>
                            <div>
                                <h1 className="text-2xl md:text-3xl font-black uppercase italic tracking-tighter text-white">{p.label}</h1>
                                <p className="text-blue-500 font-bold uppercase tracking-[0.2em] text-[10px] mt-2">Painel de Amostragem 40%</p>

            };

            const MobileNav = () => (
                <div className="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around items-center h-16 z-50 px-2 pb-safe">
                    <button onClick={() => setView('DASHBOARD')} className={`flex flex-col items-center justify-center w-16 h-full ${view === 'DASHBOARD' || view === 'COMPILADO_ANUAL' ? 'text-blue-500' : 'text-slate-500'}`}>
                        <Icons.Dashboard />
                        <span className="text-[8px] font-bold mt-1">Painel</span>
                    </button>
                    {selectedPeriod && (
                        <button onClick={() => setView('PERIODO')} className={`flex flex-col items-center justify-center w-16 h-full ${view === 'PERIODO' || view === 'COMPILADO_PERIODO' ? 'text-blue-500' : 'text-slate-500'}`}>
                            <Icons.ActivityDoc />
                            <span className="text-[8px] font-bold mt-1">Amostra</span>
                        </button>
                    )}
                    {selectedRecord && (
                        <button onClick={() => setView('AVALIACAO')} className={`flex flex-col items-center justify-center w-16 h-full ${view === 'AVALIACAO' ? 'text-blue-500' : 'text-slate-500'}`}>
                            <Icons.FileCheck />
                            <span className="text-[8px] font-bold mt-1">Auditoria</span>
                        </button>
                    )}
                </div>
            );

            return (
                <div className="h-screen w-full flex flex-col md:flex-row bg-slate-950 overflow-hidden">
                    {/* SIDEBAR DESKTOP */}
                    <div className="hidden md:flex w-20 lg:w-24 bg-slate-900 border-r border-slate-800 flex-col items-center py-8 z-50 shrink-0">
                        <div className="p-3 bg-blue-600 rounded-xl shadow-lg mb-8"><Icons.Shield size={24}/></div>
                        <div className="flex flex-col gap-4 w-full px-4">
                            <button onClick={() => setView('DASHBOARD')} title="Painel de Controle" className={`p-3 w-full flex justify-center rounded-xl transition-all ${view === 'DASHBOARD' || view === 'COMPILADO_ANUAL' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-800'}`}><Icons.Dashboard /></button>
                            {selectedPeriod && <button onClick={() => setView('PERIODO')} title="Amostragem" className={`p-3 w-full flex justify-center rounded-xl transition-all ${view === 'PERIODO' || view === 'COMPILADO_PERIODO' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-800'}`}><Icons.ActivityDoc /></button>}
                            {selectedRecord && <button onClick={() => setView('AVALIACAO')} title="Auditoria em Andamento" className={`p-3 w-full flex justify-center rounded-xl transition-all ${view === 'AVALIACAO' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-800'}`}><Icons.FileCheck /></button>}
                        </div>
                        <div className="mt-auto opacity-30 text-[8px] font-black uppercase text-center tracking-widest">CSAE<br/>HACO</div>
                    </div>

                    {/* CONTEÚDO DINÂMICO */}
                    <div className="flex-1 overflow-y-auto h-full relative custom-scrollbar bg-slate-950">
                        {view === 'DASHBOARD' && renderDashboard()}
                        {view === 'PERIODO' && renderPeriodo()}
                        {view === 'AVALIACAO' && renderAvaliacao()}
                        {view === 'COMPILADO_PERIODO' && renderCompiladoPeriodo()}
                        {view === 'COMPILADO_ANUAL' && renderCompiladoAnual()}
                    </div>

                    {/* NAVEGAÇÃO MOBILE */}
                    <MobileNav />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
