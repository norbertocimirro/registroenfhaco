        // --- COMPONENTES COMPARTILHADOS ---
        const ChartComponent = ({ type, data, options, height = "250px" }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, { type, data, options });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data, options, type]);
            return <div style={{ position: 'relative', height, width: '100%' }}><canvas ref={chartRef}></canvas></div>;

        // --- SISTEMA PRINCIPAL ---

        const App = () => {
            const [db, setDb] = useState(() => {
                const saved = localStorage.getItem('csae_haco_v24');
                return saved ? JSON.parse(saved) : { internados: {}, records: [] };
            });

            useEffect(() => { localStorage.setItem('csae_haco_v24', JSON.stringify(db)); }, [db]);

            // Navegação e Layout
            const [view, setView] = useState('DASHBOARD'); 
            const [selectedPeriod, setSelectedPeriod] = useState(null);
            const [selectedRecord, setSelectedRecord] = useState(null);
            const [activeFormTab, setActiveFormTab] = useState('EVOLUCAO'); // ADMISSAO, EVOLUCAO, ALTA
            const [activeFormSection, setActiveFormSection] = useState('S'); // S, O, I, C
            
            const [formState, setFormState] = useState({
                adm: { procedencia: '', acompanhante: '', queixa: '', hpp: '', alergias: '', medicamentos: '' },
                subjetivo: '', sv: { pa: '', fc: '', fr: '', temp: '', spo2: '', hgt: '', eva: '' },
                exame: {}, vasculares: [], viasAereas: [], eliminações: [], diagnosticos: [],
                interpretacao: '', condutas: [], obs: '',
                escalas: {
                    braden: { p: 4, u: 4, a: 4, m: 4, n: 4, f: 3 },
                    morse: { h: 0, d: 0, a: 0, t: 0, m: 0, e: 0 },
                    glasgow: { o: 4, v: 5, m: 6, p: 0 },
                    fugulin: { em: 1, ox: 1, sv: 1, mo: 1, lo: 1, al: 1, cc: 1, el: 1, te: 1 }
                },
                alta: { motivo: '', condicao: '', transporte: '', orientacoes: '' }
            });

            const [searchTerm, setSearchTerm] = useState('');
            const [openScale, setOpenScale] = useState(null);
            const [copySuccess, setCopySuccess] = useState(false);
            const [showMobileTerminal, setShowMobileTerminal] = useState(false);

            // --- AÇÕES DO BANCO DE DADOS ---
            const savePatientsCount = (periodId, sector, count) => {
                setDb(prev => ({ ...prev, internados: { ...prev.internados, [periodId]: { ...(prev.internados[periodId] || {UPI:0, UTI:0}), [sector]: parseInt(count) || 0 } } }));
            };

            const createNewRecord = (periodId, sector) => {
                const newRecord = { id: Date.now().toString(), periodId, sector, prontuario: '', auditor: AVALIADORES[0], date: new Date().toISOString().split('T')[0], answers: {} };
                setDb(prev => ({ ...prev, records: [...prev.records, newRecord] }));
                setSelectedRecord(newRecord.id);
                setView('AVALIACAO');
            };

            const updateRecordMeta = (recordId, field, value) => {
                setDb(prev => ({ ...prev, records: prev.records.map(r => r.id === recordId ? { ...r, [field]: value } : r) }));
            };

            const answerQuestion = (recordId, questionId, value) => {
                setDb(prev => ({ ...prev, records: prev.records.map(r => r.id === recordId ? { ...r, answers: { ...r.answers, [questionId]: value } } : r) }));
            };

            const deleteRecord = (recordId) => {
                if(window.confirm("Confirmar exclusão desta auditoria?")) {
                    setDb(prev => ({ ...prev, records: prev.records.filter(r => r.id !== recordId) }));
                }
            };

            const exportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
                const a = document.createElement('a'); a.href = dataStr; a.download = `Backup_CSAE_HACO_${new Date().toISOString().split('T')[0]}.json`; a.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const imported = JSON.parse(ev.target.result);
                            if(imported.internados && imported.records) { setDb(imported); alert("Dados restaurados com sucesso!"); }
                            else alert("Arquivo inválido.");
                        } catch (err) { alert("Erro ao ler o arquivo."); }
                    };
                    reader.readAsText(file);
                }
            };

            // --- LÓGICA ESTATÍSTICA (ANALYTICS) ---
            const calculateStats = (recordsToAnalyze) => {
                const qStats = PERGUNTAS_AUDITORIA.map(q => {
                    let sim = 0, nao = 0, na = 0;
                    recordsToAnalyze.forEach(r => { const a = r.answers[q.id]; if(a === 'SIM') sim++; else if(a === 'NÃO') nao++; else if(a === 'NA') na++; });
                    const totalValido = sim + nao;
                    const pct = totalValido > 0 ? Math.round((sim / totalValido) * 100) : 0;
                    const pctFalta = totalValido > 0 ? Math.round((nao / totalValido) * 100) : 0; 
                    return { ...q, sim, nao, na, pct, pctFalta, totalValido };
                });

                let totalSimGeral = 0, totalNaoGeral = 0;
                qStats.forEach(s => { totalSimGeral += s.sim; totalNaoGeral += s.nao; });
                const globalPct = (totalSimGeral + totalNaoGeral) > 0 ? Math.round((totalSimGeral / (totalSimGeral + totalNaoGeral)) * 100) : 0;
                const sections = [...new Set(PERGUNTAS_AUDITORIA.map(q => q.sec))];
                
                return { qStats, globalPct, totalSimGeral, totalNaoGeral, sections };
            };

            // --- LÓGICA DE EVOLUÇÃO CLÍNICA ---
            const bradenCalc = useMemo(() => {
                const b = formState.escalas.braden; const total = b.p + b.u + b.a + b.m + b.n + b.f;
                return { total, r: total >= 19 ? "Sem Risco" : total >= 15 ? "Baixo" : total >= 13 ? "Moderado" : total >= 10 ? "Alto" : "Muito Elevado" };
            }, [formState.escalas.braden]);

            const morseCalc = useMemo(() => {
                const m = formState.escalas.morse; const total = m.h + m.d + m.a + m.t + m.m + m.e;
                return { total, r: total >= 45 ? "Elevado" : total >= 25 ? "Moderado" : "Baixo" };
            }, [formState.escalas.morse]);

            const fugulinCalc = useMemo(() => {
                const total = Object.values(formState.escalas.fugulin).reduce((a, b) => a + b, 0);
                return { total, d: total > 31 ? "Intensivos" : total > 26 ? "Semi-Int." : total > 20 ? "Alta Dep." : total > 14 ? "Intermed." : "Mínimos" };
            }, [formState.escalas.fugulin]);

            const glasgowCalc = useMemo(() => {
                const g = formState.escalas.glasgow; return (g.o + g.v + g.m) - g.p;
            }, [formState.escalas.glasgow]);

            const generateEvolucaoText = () => {
                const rec = db.records.find(x => x.id === selectedRecord);
                const currentSector = rec ? rec.sector : 'Setor Não Definido';
                const { sv, subjetivo, exame, vasculares, viasAereas, eliminações, diagnosticos, interpretacao, condutas, obs } = formState;

                if (activeFormTab === 'ADMISSAO') {
                    return `ADMISSÃO DE ENFERMAGEM - HACO\nSETOR: ${currentSector}\n----------------------------------\n` +
                           `[HISTÓRICO]\n- Procedência: ${formState.adm.procedencia || '--'}\n- Acompanhante: ${formState.adm.acompanhante || 'Não'}\n- Queixa: ${formState.adm.queixa || '--'}\n- HPP: ${formState.adm.hpp || '--'}\n- Alergias: ${formState.adm.alergias || 'Nega'}\n- Sinais Vitais Entrada: PA ${sv.pa} | FC ${sv.fc} | Sat ${sv.spo2}%\n----------------------------------\n[Resolução 736/2024 - CSAE-HACO]`;
                }

                if (activeFormTab === 'ALTA') {
                    return `ALTA DE ENFERMAGEM - HACO\nSETOR: ${currentSector}\n----------------------------------\n` +
                           `- Motivo da Saída: ${formState.alta.motivo || '--'}\n- Condição Clínica: ${formState.alta.condicao || '--'}\n- Transporte: ${formState.alta.transporte || '--'}\n- Orientações: ${formState.alta.orientacoes || '--'}\n----------------------------------\nPaciente orientado quanto a alta hospitalar.`;
                }

                let text = `S: ${subjetivo || 'Estável, sem queixas intercorrentes.'}\n\n`;
                text += `O: [SINAIS VITAIS]\n- PA: ${sv.pa || '--'} | FC: ${sv.fc || '--'} | FR: ${sv.fr || '--'}\n- T: ${sv.temp || '--'} | Sat: ${sv.spo2 || '--'}% | EVA: ${sv.eva || '--'}\n\n`;
                text += `[ESCALAS TÉCNICAS]\n- Glasgow-P: ${glasgowCalc}/15\n- Braden: ${bradenCalc.total} (${bradenCalc.r})\n- Morse: ${morseCalc.total} (${morseCalc.r})\n- Fugulin: ${fugulinCalc.total} (${fugulinCalc.d})\n\n`;
                
                text += `[EXAME FÍSICO POR SISTEMAS]\n`;
                Object.entries(exame).forEach(([cat, vals]) => { if(vals.length > 0) text += `- ${cat}: ${vals.join(', ')}\n`; });

                if (vasculares.length > 0 || viasAereas.length > 0 || eliminações.length > 0) {
                    text += `\n[INVASIVOS E DISPOSITIVOS]\n`;
                    vasculares.forEach(v => text += `- ${v.tipo}: em ${v.sitio} | Obs: ${v.obs}\n`);
                    viasAereas.forEach(va => text += `- ${va.tipo}: Fix ${va.fixacao}cm | Cuff ${va.cuff}mmHg | Sec: ${va.secrecao}\n`);
                    eliminações.forEach(e => text += `- ${e.tipo}: Débito ${e.debito}ml | Asp: ${e.aspecto}\n`);
                }

                text += `\nI: [DIAGNÓSTICOS NANDA-I]\n`;
                if(diagnosticos.length > 0) diagnosticos.forEach(d => text += `- ${d}\n`); else text += `- Evolução clínica favorável; necessidades básicas atendidas.\n`;
                text += `- Raciocínio Clínico: ${interpretacao || 'Manutenção do quadro.'}\n\n`;
                
                text += `C: [PLANO DE CUIDADOS E CONDUTAS]\n`;
                if(condutas.length > 0) condutas.forEach(c => text += `- ${c}\n`); else text += `- Manter cuidados de rotina.\n`;
                text += `- Notas: ${obs || 'Sem observações adicionais.'}\n\n`;
                return text + `[Resolução COFEN 736/2024 - CSAE-HACO]`;
            };

            const copyAghuse = () => {
                navigator.clipboard.writeText(generateEvolucaoText());
                setCopySuccess(true); setTimeout(() => setCopySuccess(false), 2000);
            };

            // --- RENDERIZADORES DE TELAS ---

            const renderDashboard = () => {
                const { globalPct, totalNaoGeral } = calculateStats(db.records);
                return (
                    <div className="space-y-6 md:space-y-8 animate-fade pb-20 md:pb-8">
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-6">
                            <div>
                                <h1 className="text-2xl md:text-3xl font-black uppercase tracking-tight text-white">Painel de Controle SAE</h1>
                                <p className="text-blue-500 font-bold uppercase tracking-widest text-[10px] mt-1">Gestão de Auditoria - HACO</p>
                            </div>
                            <div className="flex flex-wrap gap-3 w-full md:w-auto">
                                <button onClick={() => setView('COMPILADO_ANUAL')} className="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl text-[10px] font-bold uppercase transition-all shadow-lg"><Icons.Chart/> Análise Anual</button>
                                <button onClick={exportData} className="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-3 bg-slate-800 border border-slate-700 hover:bg-slate-700 rounded-xl text-[10px] font-bold uppercase transition-all"><Icons.Download/> Backup</button>
                                <label className="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-3 bg-slate-800 border border-slate-700 hover:bg-slate-700 rounded-xl text-[10px] font-bold uppercase transition-all cursor-pointer">
                                    <Icons.Upload/> Importar
                                    <input type="file" accept=".json" onChange={importData} className="hidden" />
                                </label>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
                                <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Conformidade Global</div>
                                <div className="text-4xl md:text-5xl font-black text-blue-500">{globalPct}%</div>
                            </div>
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
                                <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Prontuários Auditados</div>
                                <div className="text-4xl md:text-5xl font-black text-white">{db.records.length}</div>
                            </div>
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
                                <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Falhas Identificadas</div>
                                <div className="text-4xl md:text-5xl font-black text-red-500">{totalNaoGeral}</div>
                            </div>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-xs font-bold uppercase tracking-widest text-slate-500 px-1">Ciclos de Auditoria</h2>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                {PERIODOS.map(p => {
                                    const metaUPI = Math.ceil((db.internados[p.id]?.UPI || 0) * 0.4);
                                    const metaUTI = Math.ceil((db.internados[p.id]?.UTI || 0) * 0.4);
                                    const feitosUPI = db.records.filter(r => r.periodId === p.id && r.sector === 'UPI').length;
                                    const feitosUTI = db.records.filter(r => r.periodId === p.id && r.sector === 'UTI').length;

                                    return (
                                        <button key={p.id} onClick={() => { setSelectedPeriod(p.id); setView('PERIODO'); }} className="bg-slate-800 p-6 rounded-2xl border border-slate-700 hover:border-blue-500 transition-all text-left flex justify-between items-center group">
                                            <div>
                                                <div className="text-lg font-black text-white">{p.label}</div>
                                                <div className="flex gap-3 mt-2">
                                                    <span className={`text-[10px] font-bold px-2.5 py-1 rounded-md ${feitosUPI >= metaUPI && metaUPI > 0 ? 'bg-green-500/20 text-green-400' : 'bg-slate-900 text-slate-400'}`}>UPI: {feitosUPI}/{metaUPI}</span>
                                                    <span className={`text-[10px] font-bold px-2.5 py-1 rounded-md ${feitosUTI >= metaUTI && metaUTI > 0 ? 'bg-green-500/20 text-green-400' : 'bg-slate-900 text-slate-400'}`}>UTI: {feitosUTI}/{metaUTI}</span>
                                                </div>
                                            </div>
                                            <div className="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center group-hover:bg-blue-600 transition-colors text-white"><Icons.ChevronDown /></div>
                                        </button>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderPeriodo = () => {
                const p = PERIODOS.find(x => x.id === selectedPeriod);
                const internadosUPI = db.internados[p.id]?.UPI || '';
                const internadosUTI = db.internados[p.id]?.UTI || '';
                const metaUPI = Math.ceil((parseInt(internadosUPI) || 0) * 0.4);
                const metaUTI = Math.ceil((parseInt(internadosUTI) || 0) * 0.4);
                const recsUPI = db.records.filter(r => r.periodId === p.id && r.sector === 'UPI');
                const recsUTI = db.records.filter(r => r.periodId === p.id && r.sector === 'UTI');

                return (
                    <div className="space-y-6 md:space-y-8 animate-fade pb-20 md:pb-8">
                        <header className="flex items-center gap-4 border-b border-slate-800 pb-6">
                            <button onClick={() => setView('DASHBOARD')} className="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors"><Icons.Back /></button>
                            <div>
                                <h1 className="text-xl md:text-2xl font-black uppercase tracking-tight text-white">{p.label}</h1>
                                <p className="text-blue-500 font-bold uppercase tracking-widest text-[10px] mt-1">Amostragem do Período</p>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-sm space-y-5">
                                <div className="text-xs font-black uppercase text-slate-400 tracking-widest border-l-4 border-blue-500 pl-3">Meta UPI (Mín 40%)</div>
                                <div className="flex items-center gap-4">
                                    <div className="flex-1">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Total Internações Mês</label>
                                        <input type="number" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-lg font-black text-white focus:border-blue-500 outline-none" value={internadosUPI} onChange={e => savePatientsCount(p.id, 'UPI', e.target.value)} placeholder="0" />
                                    </div>
                                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center min-w-[100px]">
                                        <div className="text-[10px] font-bold text-slate-500 uppercase mb-1">Avaliados</div>
                                        <div className="text-2xl font-black text-blue-500">{recsUPI.length}/{metaUPI}</div>
                                    </div>
                                </div>
                                <button onClick={() => createNewRecord(p.id, 'UPI')} className="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-[11px] uppercase tracking-widest transition-all text-white">+ Nova Auditoria UPI</button>
                            </div>
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-sm space-y-5">
                                <div className="text-xs font-black uppercase text-slate-400 tracking-widest border-l-4 border-red-500 pl-3">Meta UTI (Mín 40%)</div>
                                <div className="flex items-center gap-4">
                                    <div className="flex-1">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Total Internações Mês</label>
                                        <input type="number" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-lg font-black text-white focus:border-red-500 outline-none" value={internadosUTI} onChange={e => savePatientsCount(p.id, 'UTI', e.target.value)} placeholder="0" />
                                    </div>
                                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center min-w-[100px]">
                                        <div className="text-[10px] font-bold text-slate-500 uppercase mb-1">Avaliados</div>
                                        <div className="text-2xl font-black text-red-500">{recsUTI.length}/{metaUTI}</div>
                                    </div>
                                </div>
                                <button onClick={() => createNewRecord(p.id, 'UTI')} className="w-full py-4 bg-red-600 hover:bg-red-500 rounded-xl font-bold text-[11px] uppercase tracking-widest transition-all text-white">+ Nova Auditoria UTI</button>
                            </div>
                        </div>

                        <div className="space-y-4">
                            <div className="flex flex-col md:flex-row justify-between md:items-center gap-4">
                                <h2 className="text-xs font-bold uppercase tracking-widest text-slate-500 px-1">Prontuários Avaliados</h2>
                                <button onClick={() => setView('COMPILADO_PERIODO')} className="px-5 py-3 bg-slate-800 border border-slate-700 hover:bg-slate-700 rounded-xl text-[10px] font-bold uppercase transition-all flex items-center justify-center gap-2"><Icons.Chart /> Estatísticas do Período</button>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                {db.records.filter(r => r.periodId === p.id).map(r => {
                                    const progress = Math.round((Object.keys(r.answers).length / 32) * 100);
                                    return (
                                        <div key={r.id} className="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-col gap-3 relative overflow-hidden">
                                            <div className="flex justify-between items-start">
                                                <div className={`text-[10px] font-bold px-2 py-0.5 rounded ${r.sector==='UPI' ? 'bg-blue-600/20 text-blue-400' : 'bg-red-600/20 text-red-400'}`}>{r.sector}</div>
                                                <button onClick={() => deleteRecord(r.id)} className="text-slate-500 hover:text-red-500"><Icons.Trash /></button>
                                            </div>
                                            <div>
                                                <div className="text-lg font-black text-white">{r.prontuario || 'Sem Prontuário'}</div>
                                                <div className="text-[10px] text-slate-400 uppercase mt-0.5">{r.auditor}</div>
                                            </div>
                                            <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden mt-2">
                                                <div className={`h-full ${progress === 100 ? 'bg-green-500' : 'bg-blue-500'}`} style={{width: `${progress}%`}}></div>
                                            </div>
                                            <button onClick={() => { setSelectedRecord(r.id); setView('AVALIACAO'); }} className="w-full py-2.5 bg-slate-900 hover:bg-slate-700 rounded-lg text-[10px] font-bold uppercase transition-colors text-slate-300 mt-1">Continuar Edição</button>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                )
            };

            const renderAvaliacao = () => {
                const rec = db.records.find(x => x.id === selectedRecord);
                if(!rec) return null;

                const progress = Math.round((Object.keys(rec.answers).length / 32) * 100);
                const sections = [...new Set(PERGUNTAS_AUDITORIA.map(q => q.sec))];

                const copyAuditReport = () => {
                    const naoAnswers = PERGUNTAS_AUDITORIA.filter(q => rec.answers[q.id] === 'NÃO');
                    let report = `*AUDITORIA SAE - HACO*\nSetor: ${rec.sector} | Prontuário: ${rec.prontuario || 'N/I'}\nAuditor: ${rec.auditor}\nData: ${rec.date}\n-----------------------\n*FALHAS IDENTIFICADAS:*\n\n`;
                    if (naoAnswers.length === 0) report += "Padrão Ouro. Nenhuma falha.";
                    else naoAnswers.forEach(q => { report += `[${q.sec}] - ${q.text}\n`; });
                    navigator.clipboard.writeText(report);
                    alert("Relatório de Falhas copiado!");
                };

                return (
                    <div className="flex flex-col lg:flex-row h-screen animate-fade bg-slate-900">
                        {/* FORMULÁRIO ESQUERDA */}
                        <div className="flex-1 flex flex-col overflow-hidden relative">
                            <header className="flex-none bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center z-10 shadow-sm">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setView('PERIODO')} className="p-2 bg-slate-800 rounded-lg"><Icons.Back /></button>
                                    <div>
                                        <div className="text-sm font-black text-white leading-tight">Auditoria: {rec.sector}</div>
                                        <div className="text-[10px] text-slate-400 font-bold uppercase">{progress}% Concluído</div>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={copyAuditReport} className="hidden md:flex px-4 py-2 bg-slate-800 text-slate-200 rounded-lg text-[10px] font-bold uppercase items-center gap-2"><Icons.ClipboardCheck /> Relatório</button>
                                    <button onClick={() => setShowMobileTerminal(!showMobileTerminal)} className="lg:hidden p-2 bg-blue-600 text-white rounded-lg"><Icons.Terminal /></button>
                                </div>
                            </header>

                            <div className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 pb-24 lg:pb-6">
                                <div className="flex gap-2 mb-6 bg-slate-800 p-1 rounded-xl overflow-x-auto no-scrollbar">
                                    <button onClick={() => setActiveFormTab('ADMISSAO')} className={`px-4 py-2.5 rounded-lg text-[10px] font-bold uppercase whitespace-nowrap transition-all ${activeFormTab === 'ADMISSAO' ? 'bg-slate-700 text-white' : 'text-slate-500'}`}>Admissão</button>
                                    <button onClick={() => setActiveFormTab('EVOLUCAO')} className={`px-4 py-2.5 rounded-lg text-[10px] font-bold uppercase whitespace-nowrap transition-all ${activeFormTab === 'EVOLUCAO' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>Evolução (SOIC)</button>
                                    <button onClick={() => setActiveFormTab('ALTA')} className={`px-4 py-2.5 rounded-lg text-[10px] font-bold uppercase whitespace-nowrap transition-all ${activeFormTab === 'ALTA' ? 'bg-slate-700 text-white' : 'text-slate-500'}`}>Alta</button>
                                    <button onClick={() => setActiveFormTab('AUDIT')} className={`px-4 py-2.5 rounded-lg text-[10px] font-bold uppercase whitespace-nowrap transition-all flex items-center gap-1 ${activeFormTab === 'AUDIT' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}><Icons.Check/> Check-list</button>
                                </div>

                                {activeFormTab === 'AUDIT' && (
                                    <div className="space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                                <label className="text-[9px] font-bold uppercase text-slate-500 block mb-1">Prontuário</label>
                                                <input className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-blue-500" value={rec.prontuario} onChange={e => updateRecordMeta(rec.id, 'prontuario', e.target.value)} />
                                            </div>
                                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                                <label className="text-[9px] font-bold uppercase text-slate-500 block mb-1">Auditor</label>
                                                <select className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-bold outline-none" value={rec.auditor} onChange={e => updateRecordMeta(rec.id, 'auditor', e.target.value)}>
                                                    {AVALIADORES.map(a => <option key={a} value={a}>{a}</option>)}
                                                </select>
                                            </div>
                                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                                <label className="text-[9px] font-bold uppercase text-slate-500 block mb-1">Data</label>
                                                <input type="date" className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-bold outline-none" value={rec.date} onChange={e => updateRecordMeta(rec.id, 'date', e.target.value)} />
                                            </div>
                                        </div>
                                        
                                        {sections.map(sec => {
                                            const qs = PERGUNTAS_AUDITORIA.filter(q => q.sec === sec);
                                            return (
                                                <div key={sec} className="space-y-3">
                                                    <h3 className="text-[10px] font-black uppercase text-blue-500 tracking-widest pl-2">{sec}</h3>
                                                    <div className="space-y-2">
                                                        {qs.map(q => (
                                                            <div key={q.id} className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row justify-between md:items-center gap-4">
                                                                <p className="text-xs font-medium text-slate-200 leading-snug">{q.id}. {q.text}</p>
                                                                <div className="flex gap-2 shrink-0 bg-slate-900 p-1.5 rounded-lg border border-slate-700 self-start md:self-auto">
                                                                    <button onClick={() => answerQuestion(rec.id, q.id, 'SIM')} className={`flex-1 md:flex-none px-4 py-2 rounded-md text-[10px] font-bold transition-all ${rec.answers[q.id] === 'SIM' ? 'bg-green-600 text-white' : 'text-slate-500'}`}>SIM</button>
                                                                    <button onClick={() => answerQuestion(rec.id, q.id, 'NÃO')} className={`flex-1 md:flex-none px-4 py-2 rounded-md text-[10px] font-bold transition-all ${rec.answers[q.id] === 'NÃO' ? 'bg-red-600 text-white' : 'text-slate-500'}`}>NÃO</button>
                                                                    <button onClick={() => answerQuestion(rec.id, q.id, 'NA')} className={`flex-1 md:flex-none px-4 py-2 rounded-md text-[10px] font-bold transition-all ${rec.answers[q.id] === 'NA' ? 'bg-slate-600 text-white' : 'text-slate-500'}`}>N/A</button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                )}

                                {activeFormTab === 'EVOLUCAO' && (
                                    <div className="space-y-6">
                                        <div className="flex bg-slate-800 p-1.5 rounded-xl border border-slate-700">
                                            {['S', 'O', 'I', 'C'].map(step => (
                                                <button key={step} onClick={() => setActiveFormSection(step)} className={`flex-1 py-2 rounded-lg text-[10px] md:text-xs font-black uppercase transition-all ${activeFormSection === step ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>{step}</button>
                                            ))}
                                        </div>

                                        {activeFormSection === 'S' && <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700"><div className="text-[10px] font-bold text-slate-500 uppercase mb-2">Relato Subjetivo</div><textarea className="w-full h-40 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500" value={formState.subjetivo} onChange={e => setFormState({...formState, subjetivo: e.target.value})} placeholder="Relatos e queixas..." /></div>}
                                        
                                        {activeFormSection === 'O' && (
                                            <div className="space-y-6">
                                                <div className="grid grid-cols-4 md:grid-cols-7 gap-2">
                                                    {['pa','fc','fr','temp','spo2','hgt','eva'].map(v => (
                                                        <div key={v} className="bg-slate-800 p-3 rounded-xl border border-slate-700"><div className="text-[9px] font-bold uppercase text-slate-500 mb-1">{v}</div><input className="w-full bg-transparent text-sm font-bold text-white outline-none" value={formState.sv[v]} onChange={e => setFormState({...formState, sv: {...formState.sv, [v]: e.target.value}})} placeholder="-" /></div>
                                                    ))}
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                                        <div className="flex justify-between items-center mb-3"><span className="text-[10px] font-bold uppercase text-blue-400">Braden</span><span className="text-xs font-black text-white">{bradenCalc.total}</span></div>
                                                        <select className="w-full bg-slate-900 p-2 rounded text-[10px] text-white outline-none mb-2" onChange={e => setFormState({...formState, escalas: {...formState.escalas, braden: {...formState.escalas.braden, m: parseInt(e.target.value)}}})}><option value="4">Mobilidade Sem Limitação</option><option value="1">Totalmente Imóvel</option></select>
                                                        <select className="w-full bg-slate-900 p-2 rounded text-[10px] text-white outline-none" onChange={e => setFormState({...formState, escalas: {...formState.escalas, braden: {...formState.escalas.braden, u: parseInt(e.target.value)}}})}><option value="4">Raramente Úmida</option><option value="1">Constantemente Úmida</option></select>
                                                    </div>
                                                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                                        <div className="flex justify-between items-center mb-3"><span className="text-[10px] font-bold uppercase text-blue-400">Fugulin</span><span className="text-xs font-black text-white">{fugulinCalc.total}</span></div>
                                                        <select className="w-full bg-slate-900 p-2 rounded text-[10px] text-white outline-none mb-2" onChange={e => setFormState({...formState, escalas: {...formState.escalas, fugulin: {...formState.escalas.fugulin, em: parseInt(e.target.value)}}})}><option value="1">Lúcido</option><option value="4">Comatoso</option></select>
                                                        <select className="w-full bg-slate-900 p-2 rounded text-[10px] text-white outline-none" onChange={e => setFormState({...formState, escalas: {...formState.escalas, fugulin: {...formState.escalas.fugulin, ox: parseInt(e.target.value)}}})}><option value="1">Ar Ambiente</option><option value="4">Vent. Mecânica</option></select>
                                                    </div>
                                                </div>
                                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                                    <div className="text-[10px] font-bold uppercase text-blue-400 mb-3">Exame Físico Rápido</div>
                                                    <div className="flex flex-wrap gap-2">
                                                        {["Eupnéico", "LOTE", "MV+ sem RA", "BRNF", "Pele Íntegra", "Edema", "Curativo Limpo"].map(o => (
                                                            <button key={o} onClick={() => {
                                                                const c = formState.exame['Geral'] || [];
                                                                setFormState({...formState, exame: {...formState.exame, 'Geral': c.includes(o) ? c.filter(x=>x!==o) : [...c, o]}});
                                                            }} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold border transition-colors ${formState.exame['Geral']?.includes(o) ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>{o}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {activeFormSection === 'I' && (
                                            <div className="space-y-4">
                                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                                    <div className="text-[10px] font-bold uppercase text-slate-500 mb-3">Diagnósticos NANDA-I</div>
                                                    <div className="flex flex-wrap gap-2 mb-4">
                                                        {["Risco de Infecção", "Risco de Queda", "Troca de gases prejudicada", "Dor aguda"].map(d => (
                                                            <button key={d} onClick={() => setFormState(p => ({...p, diagnosticos: p.diagnosticos.includes(d) ? p.diagnosticos.filter(x=>x!==d) : [...p.diagnosticos, d]}))} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold transition-colors ${formState.diagnosticos.includes(d) ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}`}>{d}</button>
                                                        ))}
                                                    </div>
                                                    <textarea className="w-full h-24 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-white outline-none" value={formState.interpretacao} onChange={e => setFormState({...formState, interpretacao: e.target.value})} placeholder="Raciocínio Clínico..." />
                                                </div>
                                            </div>
                                        )}

                                        {activeFormSection === 'C' && (
                                            <div className="space-y-4">
                                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                                    <div className="flex flex-wrap gap-2 mb-4">
                                                        {["Monitorar SSVV", "Decúbito 2/2h", "Controle Glicêmico", "Grades Elevadas"].map(c => (
                                                            <button key={c} onClick={() => setFormState(p => ({...p, condutas: p.condutas.includes(c) ? p.condutas.filter(x=>x!==c) : [...p.condutas, c]}))} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold transition-colors ${formState.condutas.includes(c) ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}`}>{c}</button>
                                                        ))}
                                                    </div>
                                                    <textarea className="w-full h-24 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-white outline-none" value={formState.obs} onChange={e => setFormState({...formState, obs: e.target.value})} placeholder="Condutas extras..." />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* TERMINAL DIREITA (Desktop fixo, Mobile Toggle) */}
                        <div className={`fixed inset-y-0 right-0 w-full md:w-[400px] lg:w-[450px] bg-slate-950 border-l border-slate-800 shadow-2xl z-40 transform transition-transform duration-300 ${showMobileTerminal ? 'translate-x-0' : 'translate-x-full lg:translate-x-0 lg:static lg:block'} flex flex-col`}>
                            <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                                <div className="text-[10px] font-black uppercase text-blue-500 flex items-center gap-2"><Icons.Terminal/> AGHUse Output</div>
                                <button onClick={() => setShowMobileTerminal(false)} className="lg:hidden p-1 text-slate-400"><Icons.X/></button>
                            </div>
                            <div className="flex-1 p-4 overflow-hidden flex flex-col">
                                <pre className="flex-1 bg-slate-900 border border-slate-800 rounded-xl p-4 text-[10px] md:text-[11px] font-mono text-emerald-400 overflow-y-auto custom-scrollbar whitespace-pre-wrap leading-relaxed select-all">
                                    {generateEvolucaoText()}
                                </pre>
                                <button onClick={copyAghuse} className={`w-full py-4 mt-4 rounded-xl font-black text-[11px] uppercase tracking-widest transition-colors flex justify-center items-center gap-2 ${copySuccess ? 'bg-green-600 text-white' : 'bg-blue-600 hover:bg-blue-500 text-white'}`}>
                                    {copySuccess ? <Icons.Check/> : <Icons.ClipboardCopy/>} {copySuccess ? "Copiado!" : "Copiar para AGHUse"}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderCompiladoPeriodo = () => {
                const p = PERIODOS.find(x => x.id === selectedPeriod);
                const recs = db.records.filter(r => r.periodId === p.id);
                const { qStats, globalPct, sections } = calculateStats(recs);

                const renderBarChart = (section) => {
                    const qs = qStats.filter(q => q.sec === section);
                    const data = { labels: qs.map(q => `Q${q.id}`), datasets: [{ data: qs.map(q => q.pctFalta), backgroundColor: '#3b82f6', borderRadius: 4 }] };
                    const options = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { title: (c) => `Q${qs[c[0].dataIndex].id}: ${qs[c[0].dataIndex].text}` } } }, scales: { y: { max: 100, grid: { color: '#1e293b' } }, x: { grid: { display: false } } } };
                    return (
                        <div key={section} className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-sm flex flex-col h-64">
                            <div className="text-[10px] font-black uppercase text-slate-400 mb-3">{section} - Faltas (%)</div>
                            <div className="flex-1"><ChartComponent type="bar" data={data} options={options} height="100%" /></div>
                        </div>
                    );
                };

                return (
                    <div className="space-y-6 md:space-y-8 animate-fade pb-20 md:pb-8 max-w-7xl mx-auto p-4 md:p-8">
                        <header className="flex items-center gap-4 border-b border-slate-800 pb-6">
                            <button onClick={() => setView('PERIODO')} className="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors"><Icons.Back /></button>
                            <div><h1 className="text-xl md:text-2xl font-black uppercase tracking-tight text-white">Análise do Período</h1><p className="text-blue-500 font-bold uppercase tracking-widest text-[10px] mt-1">{p.label}</p></div>
                        </header>
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col items-center justify-center py-10 shadow-lg">
                            <div className="text-[10px] font-black uppercase text-slate-400 mb-2">Conformidade Geral (Mês)</div>
                            <div className="text-6xl font-black text-blue-500">{globalPct}%</div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{sections.map(sec => renderBarChart(sec))}</div>
                    </div>
                );
            };

            const renderCompiladoAnual = () => {
                const { globalPct, totalNaoGeral } = calculateStats(db.records);
                const trendData = PERIODOS.map(p => calculateStats(db.records.filter(r => r.periodId === p.id)).globalPct);
                const data = { labels: PERIODOS.map(p => p.short), datasets: [{ label: 'Conformidade', data: trendData, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderWidth: 3, fill: true, tension: 0.4 }] };
                const options = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, grid: { color: '#1e293b' } }, x: { grid: { display: false } } } };

                return (
                    <div className="space-y-6 md:space-y-8 animate-fade pb-20 md:pb-8 max-w-7xl mx-auto p-4 md:p-8">
                        <header className="flex items-center gap-4 border-b border-slate-800 pb-6">
                            <button onClick={() => setView('DASHBOARD')} className="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors"><Icons.Back /></button>
                            <div><h1 className="text-xl md:text-2xl font-black uppercase tracking-tight text-white">Análise Anual</h1><p className="text-blue-500 font-bold uppercase tracking-widest text-[10px] mt-1">Evolução de Qualidade</p></div>
                        </header>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="bg-slate-800 p-8 rounded-2xl border border-slate-700 flex flex-col justify-center">
                                <div className="text-[10px] font-black uppercase text-slate-400 mb-1">Média Anual</div>
                                <div className="text-5xl font-black text-blue-500 mb-6">{globalPct}%</div>
                                <div className="text-sm font-bold text-white flex justify-between border-t border-slate-700 pt-4">Total de Falhas: <span className="text-red-500">{totalNaoGeral}</span></div>
                            </div>
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 lg:col-span-2 flex flex-col h-72">
                                <div className="text-[10px] font-black uppercase text-slate-400 mb-4">Linha de Tendência Mensal</div>
                                <div className="flex-1"><ChartComponent type="line" data={data} options={options} height="100%" /></div>
                            </div>
                        </div>
                    </div>
                );
            };

            const MobileNav = () => (
                <div className="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around items-center h-16 z-50 px-2 pb-safe">
                    <button onClick={() => setView('DASHBOARD')} className={`flex flex-col items-center justify-center w-16 h-full ${view === 'DASHBOARD' || view === 'COMPILADO_ANUAL' ? 'text-blue-500' : 'text-slate-500'}`}><Icons.Dashboard /><span className="text-[8px] font-bold mt-1">Painel</span></button>
                    {selectedPeriod && <button onClick={() => setView('PERIODO')} className={`flex flex-col items-center justify-center w-16 h-full ${view === 'PERIODO' || view === 'COMPILADO_PERIODO' ? 'text-blue-500' : 'text-slate-500'}`}><Icons.ActivityDoc /><span className="text-[8px] font-bold mt-1">Amostra</span></button>}
                    {selectedRecord && <button onClick={() => setView('AVALIACAO')} className={`flex flex-col items-center justify-center w-16 h-full ${view === 'AVALIACAO' ? 'text-blue-500' : 'text-slate-500'}`}><Icons.FilePlus /><span className="text-[8px] font-bold mt-1">Auditoria</span></button>}
                </div>
            );

            return (
                <div className="h-screen w-full flex flex-col md:flex-row bg-slate-950 overflow-hidden">
                    <div className="hidden md:flex w-20 lg:w-24 bg-slate-900 border-r border-slate-800 flex-col items-center py-8 z-50 shrink-0">
                        <div className="p-3 bg-blue-600 rounded-xl shadow-lg mb-8"><Icons.Shield size={24}/></div>
                        <div className="flex flex-col gap-4 w-full px-4">
                            <button onClick={() => setView('DASHBOARD')} title="Painel de Controle" className={`p-3 w-full flex justify-center rounded-xl transition-all ${view === 'DASHBOARD' || view === 'COMPILADO_ANUAL' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-800'}`}><Icons.Dashboard /></button>
                            {selectedPeriod && <button onClick={() => setView('PERIODO')} title="Amostragem" className={`p-3 w-full flex justify-center rounded-xl transition-all ${view === 'PERIODO' || view === 'COMPILADO_PERIODO' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-800'}`}><Icons.ActivityDoc /></button>}
                            {selectedRecord && <button onClick={() => setView('AVALIACAO')} title="Avaliação" className={`p-3 w-full flex justify-center rounded-xl transition-all ${view === 'AVALIACAO' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-800'}`}><Icons.FilePlus /></button>}
                        </div>
                        <div className="mt-auto opacity-30 text-[8px] font-black uppercase text-center tracking-widest">CSAE<br/>HACO</div>
                    </div>

                    <div className="flex-1 overflow-y-auto h-full relative custom-scrollbar bg-slate-950">
                        {view === 'DASHBOARD' && renderDashboard()}
                        {view === 'PERIODO' && renderPeriodo()}
                        {view === 'AVALIACAO' && renderAvaliacao()}
                        {view === 'COMPILADO_PERIODO' && renderCompiladoPeriodo()}
                        {view === 'COMPILADO_ANUAL' && renderCompiladoAnual()}
                    </div>

                    {view !== 'AVALIACAO' && <MobileNav />}
                    {view === 'AVALIACAO' && !showMobileTerminal && <MobileNav />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
